<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>钉钉商业版百事通 · 销售面客速查工具</title>
<style>
:root{
  --bg:#0b1020; --bg2:#111a30; --panel:#151f38; --panel2:#1b2745; --line:#25335a;
  --tx:#e8eefc; --tx2:#9fb0d0; --tx3:#6d7fa3;
  --c1:#2f6bff; --c2:#00c2a8; --c3:#ff9d2e; --c4:#e14eca; --danger:#ff5470; --warn:#ffcc4d; --ok:#37d67a;
  --chip:#22305a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:radial-gradient(1200px 700px at 15% -10%,#1b2a52 0%,var(--bg) 55%,#070b16 100%);color:var(--tx);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.55}
#app{display:flex;flex-direction:column;height:100vh}
/* top bar */
header{flex:0 0 auto;display:flex;gap:14px;align-items:center;padding:10px 16px;
  background:linear-gradient(180deg,rgba(28,42,76,.92),rgba(16,24,44,.92));border-bottom:1px solid var(--line);
  box-shadow:0 6px 24px rgba(0,0,0,.35);position:relative;z-index:40}
.brand{display:flex;flex-direction:column;min-width:150px}
.brand b{font-size:16px;letter-spacing:.5px;background:linear-gradient(90deg,#8fb6ff,#00e0c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:11px;color:var(--tx3)}
.searchwrap{flex:1 1 auto;position:relative;max-width:760px}
#q{width:100%;padding:11px 210px 11px 14px;border-radius:10px;border:1px solid #2c3f6e;background:var(--panel);
  color:var(--tx);font-size:15px;outline:none}
#q:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(47,107,255,.18)}
#qhint{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--tx3)}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;max-height:64vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.6);display:none}
#results.on{display:block}
.res{padding:9px 12px;border-bottom:1px solid #202c4e;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.res:last-child{border-bottom:none}
.res.sel,.res:hover{background:#22335c}
.res .nm{font-weight:600;font-size:14px}
.res .mo{font-size:11px;color:var(--tx3);white-space:nowrap}
.res .hit{font-size:12px;color:#8ea6cc;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .th{font-size:11px;color:var(--c2);white-space:nowrap}
.headright{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.vbtn{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#18233f;color:var(--tx2);cursor:pointer;font-size:12px}
.vbtn.on{background:linear-gradient(180deg,#2f6bff,#1f4bc0);color:#fff;border-color:#4d80ff;box-shadow:0 4px 14px rgba(47,107,255,.35)}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);cursor:pointer;user-select:none;
  padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#18233f}
.toggle input{accent-color:var(--c1)}
/* body */
main{flex:1 1 auto;display:flex;min-height:0}
nav{flex:0 0 208px;overflow:auto;padding:12px 8px 40px 12px;border-right:1px solid var(--line);background:rgba(12,18,34,.6)}
nav h4{margin:14px 6px 6px;font-size:11px;color:var(--tx3);letter-spacing:1px;font-weight:600}
.nv{display:flex;justify-content:space-between;gap:6px;padding:6px 9px;border-radius:8px;cursor:pointer;color:var(--tx2);font-size:13px}
.nv:hover{background:#1c2a4c;color:var(--tx)}
.nv.on{background:linear-gradient(90deg,#22407e,#1b2b52);color:#fff}
.nv .ct{font-size:11px;color:var(--tx3)}
section{flex:1 1 auto;overflow:auto;padding:16px 22px 60px}
.crumb{font-size:12px;color:var(--tx3);margin-bottom:6px}
.crumb b{color:var(--tx2);font-weight:600}
h1{margin:0 0 4px;font-size:24px;letter-spacing:.3px}
h2{margin:22px 0 8px;font-size:17px}
.sub{color:var(--tx2);font-size:13px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--tx2)}
.chip.k1{color:#0a1020;background:linear-gradient(90deg,#59d7ff,#37d67a);border-color:transparent;font-weight:700}
.chip.k2{color:#fff;background:linear-gradient(90deg,#ff8fa3,#ff5470);border-color:transparent;font-weight:700}
.chip.k3{color:#0a1020;background:linear-gradient(90deg,#ffd86b,#ffb03a);border-color:transparent;font-weight:700}
.card{background:linear-gradient(180deg,var(--panel),#121c34);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.card>h3{margin:0 0 10px;font-size:13px;letter-spacing:1px;color:var(--tx3);text-transform:uppercase;font-weight:700}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid #1f2c4f;padding:7px 9px;text-align:left;vertical-align:top}
th{color:var(--tx3);font-weight:600;font-size:12px;background:#131d36}
td.cur{background:rgba(47,107,255,.12)}
td.have{color:#dff5e6}
td.no{color:#7b8aa8}
td.flag{color:#ffd9a0}
.vtag{display:inline-block;min-width:0;font-size:12px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
.list{margin:0;padding-left:18px}
.list li{margin:5px 0}
.talk{background:linear-gradient(180deg,#17304f,#132443);border:1px solid #24486e;border-left:4px solid var(--c1);
  border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.75;position:relative}
.talk .cp{position:absolute;right:10px;top:10px;font-size:11px;color:var(--tx3);cursor:pointer;border:1px solid var(--line);padding:2px 8px;border-radius:6px;background:#16233f}
.talk .cp:hover{color:#fff;border-color:#4d80ff}
.risk{background:linear-gradient(180deg,#3a1a26,#2a1420);border:1px solid #5d2637;border-left:4px solid var(--danger);
  border-radius:12px;padding:13px 15px}
.risk .list li{color:#ffd8e0}
.note{background:linear-gradient(180deg,#2e2a12,#231f0f);border:1px solid #5c5326;border-left:4px solid var(--warn);
  border-radius:12px;padding:12px 14px;color:#ffeeba}
.qa{border-top:1px dashed #26355c;padding:9px 0}
.qa:first-child{border-top:none}
.qa b{color:#bcd4ff}
.src{font-size:11px;color:var(--tx3);line-height:1.7}
.src a{color:#6f8fc8;text-decoration:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--tx3)}
.verset{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.vcard{border-radius:14px;padding:14px;border:1px solid var(--line);background:linear-gradient(180deg,#1a2743,#131d34);position:relative;overflow:hidden}
.vcard:before{content:"";position:absolute;inset:0 0 auto 0;height:4px}
.vcard.v1:before{background:var(--c1)} .vcard.v2:before{background:var(--c2)}
.vcard.v3:before{background:var(--c3)} .vcard.v4:before{background:var(--c4)}
.vcard h3{margin:4px 0 2px;font-size:17px}
.vcard.selected{border-color:#4d80ff;box-shadow:0 0 0 2px rgba(77,128,255,.35)}
.nv.dim{opacity:.45;font-size:12px}
.nvgap{height:6px}
.nvsub{padding:4px 9px 4px 22px;font-size:12px}
.vcard .price{font-size:13px;color:var(--warn);font-weight:700}
.vcard .role{font-size:12px;color:var(--tx2);min-height:32px}
.btn{display:inline-block;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#1a2743;color:var(--tx);cursor:pointer;font-size:13px}
.btn:hover{border-color:#4d80ff}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:4px 16px;font-size:11px;color:var(--tx3);
  background:rgba(8,12,24,.85);border-top:1px solid var(--line)}
.hidden{display:none!important}
.badge-int{font-size:10px;background:#5b2c0a;color:#ffcf9a;border:1px solid #8a4510;padding:1px 6px;border-radius:5px;margin-left:6px}
.tagline{font-size:12px;color:var(--tx3);margin-top:2px}
.hl{background:#2c4b86;color:#fff;border-radius:3px;padding:0 2px}
@media (max-width:1080px){nav{display:none}}

/* ========== v2.3 模式选择弹窗 ========== */
#modeModal{position:fixed;inset:0;background:rgba(4,7,16,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .18s ease-out}
#modeModal.hide{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.mode-card{max-width:640px;width:100%;background:linear-gradient(180deg,#182444,#0f1830);border:1px solid #2c3f6e;
  border-radius:20px;padding:28px 26px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:popIn .25s ease-out}
.mode-logo{font-size:13px;color:#8fb6ff;letter-spacing:2px;text-align:center;margin-bottom:6px;font-weight:600}
.mode-title{font-size:24px;font-weight:700;text-align:center;margin-bottom:6px;
  background:linear-gradient(90deg,#8fb6ff,#00e0c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.mode-sub{font-size:13px;color:var(--tx2);text-align:center;margin-bottom:22px;line-height:1.6}
.mode-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.mode-opt{background:linear-gradient(180deg,#1a2743,#131d34);border:1.5px solid #2c3f6e;border-radius:16px;
  padding:22px 16px;cursor:pointer;text-align:center;transition:all .18s;color:var(--tx);font-family:inherit}
.mode-opt:hover{border-color:#4d80ff;transform:translateY(-2px);box-shadow:0 12px 30px rgba(47,107,255,.25)}
.mode-opt.recommend{border-color:#00c2a8;position:relative}
.mode-opt.recommend:after{content:"推荐";position:absolute;top:-9px;right:12px;background:linear-gradient(90deg,#00c2a8,#37d67a);
  color:#062018;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:1px}
.mode-ico{font-size:38px;margin-bottom:8px;line-height:1}
.mode-name{font-size:17px;font-weight:700;margin-bottom:4px}
.mode-desc{font-size:12px;color:var(--tx2);line-height:1.5}
.mode-tip{font-size:12px;color:var(--tx3);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.mode-tip label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--tx2)}
.mode-tip input{accent-color:var(--c1)}
.mode-tip a{color:#8fb6ff;cursor:pointer;text-decoration:underline}
@media (max-width:520px){
  .mode-card{padding:22px 16px;border-radius:16px}
  .mode-title{font-size:20px}
  .mode-opts{grid-template-columns:1fr;gap:10px}
  .mode-opt{padding:16px 14px;display:flex;align-items:center;gap:14px;text-align:left}
  .mode-ico{font-size:30px;margin-bottom:0}
  .mode-opt>div:nth-child(2){flex:1}
}

/* ========== v2.3 手机模式 UI ========== */
body.mode-mobile{font-size:15px}
body.mode-mobile #app{height:100vh;height:100dvh}
body.mode-mobile header{flex-direction:column;align-items:stretch;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
body.mode-mobile .brand{flex-direction:row;align-items:center;justify-content:space-between;min-width:0;gap:8px}
body.mode-mobile .brand b{font-size:15px}
body.mode-mobile .brand span{font-size:10px}
body.mode-mobile .searchwrap{max-width:none;order:3}
body.mode-mobile #q{padding:12px 44px 12px 40px;font-size:16px;border-radius:12px}
body.mode-mobile #qhint{display:none}
body.mode-mobile .searchwrap:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.6;pointer-events:none;z-index:2}
body.mode-mobile #results{position:absolute;top:calc(100% + 6px);left:0;right:0;bottom:auto;max-height:46vh;border-radius:12px;z-index:200}
body.mode-mobile .headright{order:2;justify-content:space-between;width:100%;gap:6px}
body.mode-mobile #vbtns{flex:1 1 auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
body.mode-mobile #vbtns::-webkit-scrollbar{display:none}
body.mode-mobile .vbtn{padding:6px 11px;font-size:12px;flex:0 0 auto;white-space:nowrap}
body.mode-mobile .toggle{padding:5px 9px;font-size:11px;flex:0 0 auto}
body.mode-mobile #homeBtn{padding:5px 10px;font-size:12px;flex:0 0 auto}
body.mode-mobile .mode-sw{padding:5px 9px;font-size:11px;flex:0 0 auto;background:#18233f;border:1px solid var(--line);
  border-radius:8px;color:var(--tx2);cursor:pointer}

body.mode-mobile main{position:relative}
body.mode-mobile nav{display:none}
body.mode-mobile nav.drawer-open{display:block;position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:320px;z-index:300;
  background:#0d1428;border-right:1px solid #2c3f6e;box-shadow:8px 0 40px rgba(0,0,0,.6);padding:16px 12px 80px;
  animation:slideIn .2s ease-out;overflow-y:auto}
@keyframes slideIn{from{transform:translateX(-100%)}to{transform:none}}
body.mode-mobile .drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:299;animation:fadeIn .18s}
body.mode-mobile .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:0 6px 12px;
  border-bottom:1px solid var(--line);margin-bottom:8px}
body.mode-mobile .drawer-head b{font-size:15px;color:#8fb6ff}
body.mode-mobile .drawer-close{background:#1a2743;border:1px solid var(--line);color:var(--tx);
  width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1}
body.mode-mobile .nv{padding:11px 12px;font-size:14px;border-radius:10px;margin-bottom:2px}
body.mode-mobile nav h4{margin:16px 6px 8px;font-size:11px}

body.mode-mobile section{padding:14px 14px 90px;overflow-y:auto;-webkit-overflow-scrolling:touch}
body.mode-mobile h1{font-size:20px;line-height:1.35;margin-bottom:8px}
body.mode-mobile h2{font-size:16px;margin:18px 0 8px}
body.mode-mobile .sub{font-size:13px;line-height:1.65}
body.mode-mobile .crumb{font-size:11px}
body.mode-mobile .card{padding:13px 14px;border-radius:12px;margin-bottom:12px}
body.mode-mobile .card>h3{font-size:12px;margin-bottom:8px}
body.mode-mobile .grid.g2{grid-template-columns:1fr}
body.mode-mobile .verset{grid-template-columns:1fr;gap:10px}
body.mode-mobile .vcard{padding:14px}
body.mode-mobile .vcard h3{font-size:16px}
body.mode-mobile .chips{gap:6px;margin:6px 0 12px}
body.mode-mobile .chip{font-size:11px;padding:4px 9px;line-height:1.4}
body.mode-mobile .talk{padding:12px 13px;font-size:14px;line-height:1.75}
body.mode-mobile .talk .cp{padding:4px 10px;font-size:11px}
body.mode-mobile .risk,body.mode-mobile .note{padding:12px 13px;font-size:13px}
body.mode-mobile .list{padding-left:20px}
body.mode-mobile .list li{margin:6px 0;font-size:13.5px;line-height:1.7}
body.mode-mobile .btn{padding:9px 14px;font-size:13px}
body.mode-mobile .btnrow{gap:6px}
body.mode-mobile .qa{padding:11px 0;font-size:13.5px;line-height:1.7}

/* 表格在手机模式：外层 .tw 横向滚动 + 紧凑字号（PC 端 .tw 为普通 div，布局不变） */
body.mode-mobile .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
body.mode-mobile .tw>table{width:max-content;min-width:100%;font-size:12.5px}
body.mode-mobile .tw th,body.mode-mobile .tw td{padding:8px 9px;white-space:normal;word-break:break-word}
body.mode-mobile .tw th{font-size:11.5px}
body.mode-mobile .tw td.cur{box-shadow:inset 3px 0 0 var(--c1)}

/* 底部快捷操作栏 */
body.mode-mobile .footbar{position:fixed;left:0;right:0;bottom:0;z-index:150;display:flex;
  background:rgba(10,15,30,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
body.mode-mobile .fb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;
  color:var(--tx2);cursor:pointer;border-radius:8px;font-size:10px;user-select:none}
body.mode-mobile .fb.on{color:#8fb6ff;background:rgba(47,107,255,.14)}
body.mode-mobile .fb .fi{font-size:18px;line-height:1}
body.mode-mobile .foot{display:none}

/* 手机模式下的浮动菜单按钮 */
body.mode-mobile .mob-menu{position:fixed;left:12px;bottom:76px;z-index:140;width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,#2f6bff,#1f4bc0);border:none;color:#fff;font-size:20px;cursor:pointer;
  box-shadow:0 8px 24px rgba(47,107,255,.5);display:flex;align-items:center;justify-content:center}
body.mode-mobile .mob-top{position:fixed;right:12px;bottom:76px;z-index:140;width:44px;height:44px;border-radius:50%;
  background:#1a2743;border:1px solid var(--line);color:var(--tx);font-size:16px;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}

/* PC 模式下隐藏手机专属元素 */
body.mode-pc .footbar,body.mode-pc .mob-menu,body.mode-pc .mob-top,body.mode-pc .drawer-mask{display:none!important}
body.mode-pc .mode-sw{display:inline-block}

/* 顶部模式切换小按钮（两种模式都显示） */
.mode-sw{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#18233f;color:var(--tx2);
  cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.mode-sw:hover{border-color:#4d80ff;color:#fff}

</style>
</head>
<body class="mode-pc">
<!-- v2.3 模式选择弹窗 -->
<div id="modeModal">
  <div class="mode-card">
    <div class="mode-logo">DingTalk Commercial · Sales Kit</div>
    <div class="mode-title">钉钉商业版 · 百事通</div>
    <div class="mode-sub">请选择浏览模式，通话中查询建议用手机模式<br><span style="color:var(--tx3);font-size:12px">v2.3 · 数据版 <span id="dtVerM"></span></span></div>
    <div class="mode-opts">
      <button class="mode-opt" data-mode="pc" type="button">
        <div class="mode-ico">💻</div>
        <div>
          <div class="mode-name">电脑模式</div>
          <div class="mode-desc">完整侧边栏 · 多列布局 · 大表格对比</div>
        </div>
      </button>
      <button class="mode-opt" data-mode="mobile" type="button">
        <div class="mode-ico">📱</div>
        <div>
          <div class="mode-name">手机模式</div>
          <div class="mode-desc">抽屉导航 · 底部快捷栏 · 单手操作</div>
        </div>
      </button>
    </div>
    <div class="mode-tip">
      <label><input type="checkbox" id="modeRemember" checked> 记住我的选择</label>
      <span style="color:#3d4d75">·</span>
      <span>稍后可在页面右上角切换</span>
    </div>
  </div>
</div>
<div id="app">
<header>
  <div class="brand">
    <b>钉钉商业版 · 百事通</b>
    <span>面客速查 · 数据版 <span id="dtVer"></span></span>
  </div>
  <div class="searchwrap">
    <input id="q" placeholder="输入客户说的词：开多大的会 / 群上限 / 防截屏 / 接口超限 / 多维表…" autocomplete="off">
    <span id="qhint">按 / 搜索 · ↑↓ 选择 · Enter 打开</span>
    <div id="results"></div>
  </div>
  <div class="headright">
    <div id="vbtns" style="display:flex;gap:6px"></div>

级怎么算","补差价"],"to":"page:rules"},{"terms":["教育","政府","医疗","行业","海外","学校","机关"],"to":"page:standard"},{"terms":["免费还能用吗","不想花钱","继续用免费版"],"to":"page:standard"},{"terms":["证书","学考","有没有资格卖","授权"],"to":"page:rules"},{"terms":["会不会突然不能用","清人","存量","老客户","在约"],"to":"page:timeline"},{"terms":["增购多少钱","存储扩容价格","会议室多少钱","价格表","用量包","交付服务多少钱","18万","多少钱","价格","报价","单价","增购","扩容包","存储多少钱","会议包多少钱","交付多少钱","续费多少"],"to":"page:addons"},{"terms":["服务台","互动运营"],"to":"f20"}],"modules":{"通讯录":{"what":"组织通讯录的容量、账号形态、集团化上下级打通，以及高管降噪、可见范围这类「组织怎么管」的权益。","sell":["商业版通讯录编制 = 购买人数×105%（对比表口径），比新标准版「已认证 1000 人」的硬顶更适合按规模规划；D1/D2 要求购买人数≤1000，D3/D4 不设购买人数上限。","集团型客户的抓手：上下级组织通讯录互通、跨组织基础协作、下级成员切到上级组织用工作台/新建文档，从 D1 起就有；上级邀请关联总额度 D1 起为 10 万（老标准版已认证只有 500，老专业版不提供）。","高管保护模式按档位放量：D1 100 人 / D2 500 人 / D3、D4 5000 人（老专业版 100 人）。","企业账号（账号归企业、可停用可回收）：老专业版 500 个封顶，商业版四档均为「随购买人数」。"],"talk":"您现在如果在用专业版，通讯录这块升级后主要拿到三件事：一是编制跟着您买的人数走（购买人数×105%），不再靠后台单独扩容；二是企业账号从固定 500 个变成随购买人数配置，员工离职账号能收回来；三是集团化的上下级打通——子公司通讯录互通、跨组织找人聊天、下级成员可以切到集团域里用工作台，这些专业版是没有的。要是您集团里要「上级统管下级的品牌和管控」，那就要看到 D3 及以上。","risks":["⚠️ 老专属版底座的编制写法是「购买人数×110%」，商业版是 ×105%。从专属版底座迁到商业版时可加成员会变少，报人头数时按 105% 算，别沿用 110%。","⚠️ 互动运营（服务台）：D1 不提供，D2 10 个 / D3 20 个 / D4 500 个。客户问「服务台」不能按 D1 承诺。","⚠️ 365 会员、企业账号写的是「随购买人数」，具体发放数量以开通后台与商品配置为准，别口头承诺个数。","⚠️ 上级对下级关联成员专属管控、多部门任职、可见范围、成员多端登录在新标准版是 ❌，靠商业版才补回来——续费降级客户要提醒。","【知识库补充】下单硬校验：企业购买人数必须 ≥ 通讯录实际人数；购买后通讯录上限为购买人数×105%（买 100 席上限 105 人）。不能靠「先清人再拉回」绕开。","【知识库补充】1000 人以上组织只可购买 D3/D4，不可购买 D1/D2；D3/D4 官方口径不设人数上限，但超 500 人需完成组织认证。","【知识库补充】上下级组织：完成年检认证的上级组织按商业版本自动获赠「上级可邀请关联的总额度」；下级需自行购买商业版本才具备关联与同步能力，下级人数不计入上级。","【知识库补充】通讯录是最主要的「付费墙」之一：新标准版认证后仅 1000 人（原最高 10 万），且 10.21 后不会主动清人、但无法新增员工。","【知识库补充】每个坐席等同一个企业账号（可绑钉钉账号或企业账号，不做区分），容量按组织算、不存在个人分摊。"],"sources":["SRC-XLSX","SRC-PUB-AGENT"]},"沟通":{"what":"IM 侧的硬权益：DING 加急条数、群人数上限、聊天记录与群文件的云端保存时效。","sell":["聊天记录与群文件：新标准版文字只存 2 年、专业版文件 180 天；D1 起聊天内容「存多久看多久」，这是老客户最有感的数字资产卖点。","群人数：D1–D4 内外部落在 5000 人；10000 人大群要 D3/D4；五万人超大会话群 D3/D4 各 5 个。","电话&短信 DING：D1/D2 为 600 条+120×人头数，D3/D4 为 60000 条+120×人头数（新标准版 0 条/年）。","OpenAPI 发/撤回 DING：老专业版就有，商业版四档都含。"],"talk":"沟通这块最容易讲清楚的是「历史」和「上限」两件事。第一，您现在免费标准版聊天记录文字只保留 2 年、文件到期就看不到了；商业版 D1 起是存多久看多久，群文件也一样，等于把企业的沟通资产真正留下来。第二，DING 是加急触达的刚需，新标准版一年 0 条，D1/D2 是按人头给的（600 条 + 120×人数），D3/D4 直接给到 6 万条起底再按人头加。群人数上，常规 5000 人四档都有，要万人群得到 D3、D4，五万人超级群 D3、D4 各 5 个名额。","risks":["⚠️ DING 条数不是「无限」，公式是 600 + 120×人头数（D3/D4 是 60000 + 120×人头数）。给客户算量必须拿人数来算。","⚠️ 万人群只有 D3/D4 有（老专属版底座 ✅，D1/D2 ❌）；客户从专属版底座换到 D1/D2 会掉这条。","⚠️ 老专业版「1000（组织下所有群）」与新标准版「1000」口径不同（一个是组织下所有群，一个是群上限），对比时说清是哪一列。"],"sources":["SRC-XLSX"]},"日历":{"what":"钉钉日程与企业既有日历系统（Exchange）打通的权益。","sell":["Exchange 日历双向同步：老标准版、老专业版、新标准版全部 ❌，D1 起按「随购买账号」提供——对已经用 Outlook/Exchange 的客户，这是商业版才有的入口。"],"talk":"您那边如果用 Exchange 日历，最痛的是两边日程不同步、约会被撞。这条能力专业版是没有的，商业版从 D1 开始按账号提供双向同步，具体能同步多少个账号，跟您购买的账号数走，我在开通前帮您按人数核一遍。","risks":["⚠️ 表内值是「随购买账号」，未写死数量：客户问「能同步多少人」时不要报具体数，以开通后台/技术确认为准。"],"sources":["SRC-XLSX"]},"存储":{"what":"企业级存储空间总量、单文件大小上限、容量可视化。","sell":["企业存储空间：新标准版已认证 100GB、老专业版 1T、老专属版 2T；商业版 D1 1.5T / D2 5T / D3 15T / D4 15T+30GB×人头数。","单个文件上传 100GB 各版本一致（大文件不用拆分）。","企业存储容量数据看板：老标准版/专业版 ❌，D1 起 ✅——给 IT 负责人做容量规划的抓手。"],"talk":"存储是版本跳档最直观的一项：您现在专业版是 1T，D1 给到 1.5T、D2 5T、D3 15T，D4 是 15T 再按人头加 30GB。四档都带容量看板，能看到谁在用、用在哪，做扩容预算有据可依。单文件 100GB 上限是全版本一样的，不用另外买。","risks":["⚠️ 存储是「企业总容量」，不是每人 1.5T/5T；人数多的客户要按人头算清是否够，别把总量说成人均。"],"sources":["SRC-XLSX"]},"考勤":{"what":"考勤数据可导出时长、报表定制、年度统计、高级考勤组与防作弊。","sell":["考勤数据导出：新标准版只有 180 天，D1 起「存多久导多久」；考勤报表、年度统计老标准版/新标准版 ❌，D1 起 ✅。","高级考勤组管理（快速配置、大小周双周循环、签到同步、关联规则、分组管理）与考勤防作弊：D2 起才有，是 D1→D2 的标准跳档卖点。"],"talk":"考勤上 HR 最在意的两条：报表和导出周期。免费标准版只能导 180 天，也没有可定制报表；D1 起导出跟存储一样长，报表和年度统计都打开。如果您有大小周排班、多套考勤组分组管理，或者要拦虚拟定位/越狱机代打卡，这些 D1 是没有的，要 D2 起。","risks":["⚠️ 高级考勤组与防作弊 D1 ❌、D2 ✅：客户拿「防作弊」当采购理由时，不能报 D1。"],"sources":["SRC-XLSX"]},"人事":{"what":"智能人事的高级能力：花名册、职位体系、用工风险、员工关系。","sell":["高级花名册、高级职位管理、用工安全（实人认证/风险人员/人事黑名单）、高级员工关系（新人成长/安全离职/合同管理/员工关怀）四项：老标准版、新标准版、老专业版全部 ❌，统一从 D2 起提供。"],"talk":"如果您买版本的人是 HR 或老板，人事模块是 D2 最好讲的价值：花名册可视化、职位体系可维护、入转调离和合同管理，还有用工风险检测。这几项专业版都没有，等于以前要靠另买第三方人事应用，现在底座自带（D2 起）。","risks":["⚠️ 人事四项在 D1 全部 ❌——只买 D1 的客户问「智能人事」必须说明要 D2，不要说成版本自带。"],"sources":["SRC-XLSX"]},"审批":{"what":"OA 审批的表单高级能力、流程编排、数据管理与自动化。","sell":["表单高级功能（自定义流水号、数据联动、公式、OCR）与流程高级功能（版本管理、动态流程、并行分支、节点角色多选、流程预测）：新标准版 ❌，D1 起 ✅。","流程高级配置（指定节点退回、节点跳过、反审、管理员撤销、评论撤回、审批次数上限、按部门抄送、自定义审批意见）：老专业版也 ❌，D2 起提供。","D4 独有的量级提升：流程节点（抄送/审批/办理）人数上限 100（其余档位 50）。"],"talk":"审批上您要分三层说：基础表单和并行分支这类流程能力，D1 就有，专业版升级过来的客户感觉是「原来就得有」；真正拉开差距的是流程高级配置——节点退回、跳过、反审、管理员撤销、按部门抄送，这些专业版都没有，要 D2。另外审批自动化、批量数据处理这三项，D2 和 D3 表里写的是限时体验，只有 D4 是正式权益，我不敢拿限时体验给您做承诺。","risks":["⚠️ 高风险：数据管理高级能力、批量数据处理、审批自动化在 D2/D3 标注「✅限时体验」，D4 才是 ✅。限时体验意味着可能被收回或改版，绝不能写进合同承诺。","⚠️ 审批数据导出周期老专业版是 2 年，新标准版/D1 起是「存多久导多久」——这算升级点，但要跟存储时长一起讲。","⚠️ 流程节点人数 50→100 只在 D4：大客户复杂审批流问「一个节点能挂多少人」时按档位说清。"],"sources":["SRC-XLSX"]},"知识管理":{"what":"钉钉文档/知识库的协同规模、批量处理、企业级文档治理与回溯。","sell":["文档并发编辑 100→500 人（新标准版 100 人，D1 起 500 人）；编辑历史从 3 天变成存多久看多久；日志搜索 1 年→2 年；可公开发布为网页的知识库从 10 个变不限量。","D2 起补齐企业级治理：PDF 转 docx/pptx、在线文档批量下载为 Office、离职转交管理、企业文档管理、企业知识库管理、存储空间清理、企业文件回收站（可恢复近 90 天删除）、企业文档协作数据看板。","批量下载数量：D1 100 个/次 → D2/D3/D4 1000 个/次。"],"talk":"文档这块的卖点是「企业级治理」而不是「能不能写文档」。免费/专业版下，历史只存 3 天、批量下载 50 个、公开知识库限 10 个；D1 起并发 500 人、历史按存储期保留、公开知识库不限量；真正把 IT 和知识管理员解放出来的是 D2——企业文档全局搜索管理、回收站、存储清理、离职文档转交、协作看板，加上 PDF 一键转 Office。以前这些要么没有要么买第三方。","risks":["⚠️ 企业文档管理/知识库管理/存储清理/回收站/协作看板在 D1 全部 ❌，必须讲成 D2 起的能力。","⚠️ PDF 文件处理、批量下载为 Office 也是 D2 起。","⚠️ 企业文件回收站写的是「可恢复近 90 天内被删除的文件」，别说成无限回溯。"],"sources":["SRC-XLSX"]},"钉钉企业邮箱基础版":{"what":"随商业版本底座提供的企业邮箱能力（账号数、收发信限额、附件、与钉钉协同）。","sell":["老专业版不含邮箱、老专属版只有 20 个账号试用；商业版 D1–D4 邮箱账号数「随底座账号数」，即按您购买的底座账号配。","发信能力：个人 6,000 封/人/天、公共邮箱 6,000 封/天、对外收件人 2,000 人/天、租户对外发信=账号数×6000 封/天、普通附件 50MB/封、支持超大附件。","邮箱与钉钉协同：邮件同步到日历、邮件转待办/日程、邮件里直接发起会议、附件中心统一搜索、邮件流规则（审核/转发/过滤）。"],"talk":"邮箱这次是随商业版底座走的，不用再单独买一套：账号数跟您底座账号数一致，发信限额给到个人 6000 封一天、对外 2000 人一天，附件 50MB 一封、还有云附件。真正省事的是跟钉钉打通——收到邮件一键变待办、变日程、直接在邮件里发起会议，附件有统一视图能搜能批量下。","risks":["⚠️ 「底座账号数」到底是几个账号，表里没有明确等式（老专属版写法是 20 个账号试用）。报价前必须用《报价工具》《SOW》核实，不得口头承诺账号数。","⚠️ 企业邮箱基础版 ≠ 邮箱增值服务（如更大附件、更多域名、专属存储），客户要专业邮箱时先问需求再核对增购口径。","⚠️ 邮箱类 27 项几乎全是 D1–D4 同值，说明它不是版本跳档项，别拿它做「买高版本才有邮箱」的说法。"],"sources":["SRC-XLSX"]},"会议":{"what":"视频会议的分钟额度、单场人数与时长、并发、清晰度、会议室硬件与电话拨入。","sell":["会议分钟额度（年）：新标准版 100 万分钟；D1 100 万 / D2 300 万 / D3 1500 万 / D4 1500 万+4000×人头数。","单场参会人数阶梯：新标准版 25 人 → D1 50 人 → D2 100 人 → D3 500 人 → D4 1000 人；四档单场时长都是 24 小时（新标准版 60 分钟）。","同时发起会议数：新标准版 3 个 → D1 起不限；清晰度 D1 起最高 1080P；摄像头不限；分组讨论 50 组；联席主持人 50 个。","专业功能：会议转直播、远程控制、多端入会、会议等候室、同声传译、智能字幕、会议室预定系统全部 D1 起；智能会议室 Rooms 数量 D1 2 / D2 3 / D3 5 / D4 25；电话拨入 PSTN 为 D2 起（D2 1000 / D3 2000 / D4 3000 分钟/年）。"],"talk":"会议是版本差异最好卖的一块，我先给您两个数：单场人数和分钟额度。免费标准版现在单场只有 25 人、60 分钟，您员工体感是「开到一半要重连」；商业版四档都是 24 小时会议、并发不限、1080P、摄像头不限，差别在单场人数——D1 50 人、D2 100 人、D3 500 人、D4 1000 人，年度分钟额度从 100 万到 1500 万+按人头加。要是您有会议室一体机，Rooms 名额也从 D1 的 2 个到 D4 的 25 个。电话拨入这条 D1 没有，从 D2 起才有额度，这个我要提前跟您说清。","risks":["⚠️ 分钟额度是「年度总量」，不是「不限时长」；客户问「能开多久」时要把单场 24 小时和年总额分开说。","⚠️ D1 单场只有 50 人：从老专业版（100 人）转过来的客户如果买 D1，单场人数会变小——这是典型降级点，必须主动讲。","⚠️ 老专业版会议写法是「支持选配（3 个 60 分钟标清 + 2 个 24 小时高清云会议室）」，属于选配口径，别按标配对比。","⚠️ 智能字幕在新标准版是「限时体验 10 分钟/场」，D1 起为 ✅；Rooms/PSTN 有数量与额度上限，按档位报数。","【知识库补充】会议额度耗尽后是「不能开会」，不是降清晰度——选档必须按年度总量估，不要凭感觉。","【知识库补充】分钟消耗按设备数累加：一场会 10 人参加、2 人双设备入会 =（8 + 2×2）× 参会分钟数。多端入会会加速消耗。","【知识库补充】视频会议额度不包含 AI 听记；钉钉商业版本不含 AI 听记权益，需单独购买，AI 听记消耗 AI 算力/千问积分，与时长包独立结算。","【知识库补充】商业版本不包含额外直播权益，与标准版一致：每组织 3000 分钟/年标清（1 个 300 方标清直播间），更多需单独购买「直播时长包」。","【知识库补充】100 方云会议室 Rooms 权益 10.21 后不再单独售卖，只能通过底座 + 对应增购能力实现；会议时长包等增购走独立 SKU、独立扣款。","【口径冲突】话术参考把 D2 写成「300 万分钟/月」、D3 写成「1500 万分钟/月」，而对比表列名是「/年」。对客统一说年度额度。"],"sources":["SRC-XLSX"]},"云打印":{"what":"免驱打印、多端漫游、扫码安全打印、打印统计与权限管控。","sell":["云打印绑定设备数：D1–D3 各 300 台，D4 1000 台（新标准版 ❌）。","多格式打印、打印选项/参数、免装驱动、多端漫游打印：老专业版就有，商业版 D1 起全部包含。","管控类是新增价值：全员扫码安全打印、打印智能统计（计费到人/按部门）、按部门人员可见权限、插件打印、任务与耗材监控，D1 起提供。"],"talk":"打印上 D1 起就能做「扫码出单 + 打印留痕 + 成本到人」：员工必须扫码才打、打什么、多少页、哪个部门都能统计，管理员还能控制谁能看见哪台打印机。设备授权数 D1 到 D3 是 300 台，D4 是 1000 台，工厂/连锁客户要按点数选档。","risks":["⚠️ 老专业版「不限许可」，商业版 D1–D3 是 300 台：客户打印点数超过 300 台时，从专业版升 D1/D2/D3 会受限，要么 D4 要么核实增购口径。","【知识库补充】云打印属于「融入底座的单品」，2026.10.21 起老单品停售：标准版用户不可再单买，需先购底座；专业版/专属版在约客户仍可正常购买。"],"sources":["SRC-XLSX"]},"AI表格":{"what":"多维表/AI 表格的规模上限、仪表盘与权限、跨表同步、AI 字段能力。","sell":["跨表组合分析图表：老专业版 1 个 → D1 5 个 / D2 50 个 / D3、D4 200 个；高级权限自定义角色数 3 → 5 / 50 / 100 / 100。","单数据表行数：D1 2 万行（限时）/ D2 2 万行 / D3、D4 5 万行；历史记录回溯从 30 天延长到 D2 起 365 天。","D2 起解锁千人千面仪表盘、跨 AI 表格数据同步、AI 字段高速通道。","AI 能力（100+ 业务场景 AI 字段模板、AI 建表/字段/视图/表单/自动化/仪表盘/智能问数）各版本都有，但标注「消耗算粒」。"],"talk":"AI 表格是这次商业版把原来单独卖的 Office 套件、AI 表格高级功能并进来的重点。日常协同 2 万行够用，数据量大或要做权限分身就要往 D3、D4 走（5 万行、200 个联表图表、50/100 个自定义角色、365 天回溯）。有一点我必须提前说：AI 字段能力是消耗算粒的，不是「买完随便用」，随版本赠送的千问办公积分是这部分的主要额度。","risks":["⚠️ 单表行数写的是「2 万行（限时）」（新标准版/D1）：不能把它当成 D1 的长期能力承诺，也不要引用「最高 1000 万行」的说明文字当作版本自带规格。","⚠️ AI 能力全档位都写「消耗算粒」：AI 用量成本要单独测算，别承诺 AI 功能无限量。","⚠️ 千人千面仪表盘、跨表同步、AI 字段高速通道 D1 ❌ / D2 ✅。","【知识库补充】官方对「2 万行限时」的答复：标准版免费提供限时 2 万行体验额度，如无更多调整客户可持续使用，具体截止时间以官方 SOW/知识库为准——不要自行给截止日期。","【知识库补充】AI 表格属于「融入底座的单品」，10.21 后老单品停售；已付费在约客户合约期内权益不受影响，到期引导升级底座；老 AI 表格多年单品客户升 D2 及以上不做退款/折算，用折扣策略引导。","【知识库补充】AI 用量结算：不额外赠送钉钉算粒，算粒与千问积分暂未打通（后续统一成千问积分）。随版本赠送的是千问办公积分。"],"sources":["SRC-XLSX","SRC-PUB-AGENT"]},"开放与集成":{"what":"API 调用量、QPS、Webhook/Stream、连接流、自建应用与审批开放能力。","sell":["付费 API 调用量：新标准版 1 万/月（原 5000/月，官方已提升）、老专业版 20 万次/自然月、老专属版 550 万次；商业版四档全部「无上限」。","Webhook&Stream 调用量：新标准版起即无上限；QPS 从 20 提升到 60（与官方公告一致）。","连接流节点执行量跳档明显：D1 700/月 → D2 50 万/月 → D3 100 万/月 → D4（250 万 + 60×购买人数）/月。","D3 起补上集成深水区：审批集成开放能力（页面设计、审批托管、接口开放、被三方集成）、实人认证&人脸比对、客户端数字角标。"],"talk":"IT 和数字化负责人最认这条：商业版 API 调用不设上限、QPS 给到 60，您把钉钉当业务底座、让智能体反复调接口也不用担心超额。真正要选档的是连接流——只做几个流程 D1 的 700 次/月就够，但要做跨系统自动化就得 D2 的 50 万次起步，集团级 D4 是按人数加量。审批要开放给第三方系统集成，那是 D3 的事。","risks":["⚠️ 「无上限」指付费 API 调用量；连接流节点执行量是按档位有明确额度的，别混为一谈。","⚠️ 自定义工作台 D1 起写 ✅，老专业版是「桌面端/移动端各 10 个页面」：页面数量口径变化要确认客户实际用量。","⚠️ 实人认证、数字角标在老专属版写作「开放&集成」（独立商品），D1/D2 ❌、D3 ✅；涉及这些能力时先确认客户是否已单独购买过。","【知识库补充】连接流不叠加：标准版免费额度 10.21 后调整为 700 次/月，D1 也是 700 次/月，不是相加。需求更高引导 D2 及以上。","【知识库补充】连接流可用「连接流增购包」单独提升额度；阿里云 code 预计 10 月底上线，对接中，走阿里云渠道前先确认时点。","【知识库补充】日历 Exchange 同步属于「融入底座的单品」，10.21 后老单品停售，需先有商业版本再谈增购。"],"sources":["SRC-XLSX","SRC-PUB-OPEN"]},"安全运营":{"what":"风险统一管理、异常行为预警与自动管控、数据误删恢复。","sell":["自助数据恢复：老专业版 30 次 → D1 起 1 万次（流程误删恢复、文件误删恢复、群解散恢复、DING/消息撤回、重置群主）。","人工数据恢复 10 次（D3、D4）；风险管理与预警事件、用户管控查询从 D3 起提供。","D4 独占：行为预警、自动管控列表（预警触发后自动管控员工与事件的清单管理）。"],"talk":"安全运营讲的是「出事能不能自己救回来、有没有人管」。误删恢复从专业版的 30 次提升到 1 万次自助额度，日常够用；要人工介入恢复，那是 D3、D4 各 10 次。真正做安全合规运营（自定义异常行为预警、命中后自动管控、留处置清单）的客户，我建议直接看 D4，因为行为预警和自动管控列表这两条 D3 都没有。","risks":["⚠️ 行为预警、自动管控列表 = D4 独占（D3 ❌），这是最容易讲错的一档。","⚠️ 人工数据恢复老专属版 10 次、D1/D2 ❌，不能对 D1/D2 客户承诺人工服务次数。"],"sources":["SRC-XLSX"]},"账号安全":{"what":"组织代码登录、SSO 单点登录、企业账号登录与密码策略管控。","sell":["组织代码登录设置 D1 起可用；SSO 单点登录、企业账号管控、登录两步验证、企业账号密码管理四项全部从 D3 起提供（老专业版 ❌，老专属版底座 ✅）。"],"talk":"如果客户的 IT 要求「员工用我们自己的账号体系登录、密码策略我来定、异地登录要二次验证」，这一组是 D3 的门槛能力，跟专属品牌、安全防泄是一起打包的。D1、D2 只给到组织代码登录，别把 SSO 说成 D2 有。","risks":["⚠️ 这一模块是「D3 起」最典型的跳档点，销售最容易在 D2 上乱承诺 SSO。"],"sources":["SRC-XLSX"]},"安全准入":{"what":"谁能用什么设备、在什么网络、装什么版本才能登录钉钉。","sell":["登录管理、钉钉锁屏保护、钉钉版本管理、操作系统版本管理：老专业版 ❌，D3 起提供。","可信设备、网络代理、IP 围栏：D4 独占（老专属版底座写法是「访问&数据安全」独立商品）。"],"talk":"准入是甲方安全部门最爱问的：能不能只允许公司设备登录、能不能限定只在办公网络用、低版本客户端强制不让登。前半段（登录管理、锁屏、版本与系统版本管控）D3 有；「可信设备 + IP 围栏 + 内网代理」这三件套是 D4 才有，而且它们以前是按「访问&数据安全」单独卖的商品，现在并到 D4 底座里，这就是升级的说服力。","risks":["⚠️ 老专属版的「访问&数据安全」是独立商品名，意味着部分客户是单独买过的；迁移到商业版时要按档位重新核对，不要默认继承。"],"sources":["SRC-XLSX"]},"行为管控":{"what":"对员工在组织内的行为边界做管控：退出、可见性、外部联系、待办日程密聊、群与 DING。","sell":["员工退出管控：老专业版就有，商业版四档均含；设置禁止申请文档/权限 D2 起。","通讯录可见性、组织行为管控、外部联系管控、待办管控、日程管控、密聊管控、沟通协作管控：D3 起提供。","DING 管控、群管控、VIP 人群管控：D4 独占。"],"talk":"管控类要按「管到哪一层」来报价：管员工能不能加外部人、能不能被看到、能不能建日程待办，是 D3；要管到「谁能给谁发 DING、谁能建群/进群、VIP 高管的协同权限」，是 D4。别拿 D4 的清单去报 D3 的价。","risks":["⚠️ DING 管控、群管控、VIP 人群管控是 D4 独占，销售高频误承诺项。"],"sources":["SRC-XLSX"]},"数据防泄":{"what":"文件护盾、文档与钉内文件操作管控、水印、防截录屏、离职数据保护。","sell":["D1 起就有：企业文件护盾、保密群（防转发/防截屏/水印）、文档操作留痕基础能力。","D2 起加：文档外部成员管理（管外部协作者的共享范围）。","D3 起成套：在线文档管控、钉内文件管控、信息保护、离职数据管理、全局明水印。","D4 独占：全局暗水印（肉眼不可见、可解析定位到人）、全局防录防截、全局粘贴管控、敏感词管理、企业密钥管理（对接三方 KMS）。"],"talk":"数据安全是 D3、D4 的主战场，也是单价能谈上去的地方。D3 能管住「文档能不能复制导出、文件能不能转发下载、离职的人能不能带走东西、屏上有没有明水印」；但客户如果提的是暗水印溯源、禁止截屏录屏、禁止粘贴出钉钉、敏感词拦截、企业自持密钥——这五件是 D4 才有的，其中暗水印和防录防截往往是政企、金融、研发型客户的硬性要求，可以直接以此定档。","risks":["⚠️ 全局暗水印 / 防录防截 / 粘贴管控 / 敏感词 / 企业密钥 = D4 独占，D3 只有明水印与常规管控。","⚠️ 老专属版这些项写作「访问&数据安全」（独立商品）：从专属版迁商业版的客户，要逐条核对档位是否覆盖。","⚠️ 企业密钥管理写明「购买三方云厂商 KMS 密钥管理服务」，涉及三方费用，不能只报版本价。","【知识库补充】FAQ 对「D3 专属安全 vs D4 访问&数据安全」的官方答复是「参考专属版或直接看 SOW」——这题不要自己编答案，把差异讲成「D4 才有策略引擎层（密级标签/DLP/访问控制中心/三色管控）+ 暗水印/防录防截」，细节以 SOW 为准。","【知识库补充】仅 D4 可增购 APP 定制、混合云&合规、移动端设备管理 MDM；这三项是客户问「D4 还多什么」时的标准答案。"],"sources":["SRC-XLSX"]},"安全引擎":{"what":"数据密级标签、DLP 规则、访问控制中心、三色管控——企业数据流转的策略引擎。","sell":["数据密级标签、DLP 规则配置、访问控制中心、三色管控四项全部为 D4 独占（老专属版写作「访问&数据安全」独立商品）。"],"talk":"D4 的差异化就在这台「引擎」上：给文档打密级标签、配 DLP 规则、按人/按场景做访问控制、用三色管控决定文件能流转到哪里。这套能力以前是单独采购的商品，现在在 D4 里，客户如果是要做分级保护和制度落地的，D4 是唯一定档。","risks":["⚠️ 四项全为 D4 独占，且以前属独立商品；报价前先确认客户老合同里是否有「访问&数据安全」，避免重复采购或误判为可用。"],"sources":["SRC-XLSX"]},"安全集成":{"what":"把钉钉安全能力和三方安全产品对接：病毒扫描、加解密、DLP 对接、钓鱼链接管控。","sell":["文件病毒扫描、专属加解密、三色管控对接 DLP 能力：D3 起提供；钓鱼链接管控：D4 才有。"],"talk":"已有安全厂商环境的客户会问对接：钉盘文件下载到本地时调三方查杀、加密文件在钉钉内解密预览编辑、三色管控的判断交给客户自己的 DLP——这些 D3 起就支持。要把企业自有链接库做钓鱼拦截，得 D4。专属加解密依赖三方安全公司共建，落地要拉技术评估，别只签版本。","risks":["⚠️ 专属加解密 / 三色管控对接 DLP 依赖三方产品与服务，存在额外采购与实施成本；D3/D4 只是提供入口，不能承诺「开箱即用零成本」。"],"sources":["SRC-XLSX"]},"合规管理":{"what":"协议签署管理、客户端协议入口、文档操作日志审计。","sell":["文档操作日志（近 3 年基础操作记录）D1 起；企业文件高级操作日志（含 OA 后台操作）D2 起；协议管理与协议展示入口配置 D3 起。"],"talk":"有合规要求的客户要留痕：谁下载了、谁改了权限、谁导出了，D1 起有基础日志、D2 起有高级日志；要对外发协议让员工签、并把协议入口配到客户端，那是 D3。","risks":["⚠️ 单文档关键操作日志在 D2/D3/D4 均为「100 条」，量很小，不能当审计日志平台卖，需说明口径（是单文档近 100 条关键操作）。"],"sources":["SRC-XLSX"]},"品牌管理":{"what":"把钉钉「换上客户的脸」：导航栏、启动图、主题色、Logo、表情包，以及信创端授权。","sell":["整块品牌自定义（全局配置、导航栏、+号菜单、移动端吸顶栏、顶部工具栏、开机启动图、专属主题色、专属 Logo、专属表情包、表情雨、专属文字表情、专属通话海报、推送号管理、AI 助手配置、更多管理）老专业版全部 ❌，D3 起成套提供。","Linux 端授权（信创端席位自主分配）：D3、D4 提供。","超级部门（同一集团下分子公司显示各自名称）：D3、D4（老专属版写法为「APP 定制」）。"],"talk":"老板和大客户最常提的就是「打开钉钉得是我们自己的钉钉」。主题色、Logo、开机图、导航栏裁剪、把官方推送号关掉、连表情和通话海报都是企业自己的——这一整套是 D3 起，专业版是完全没有的。有信创要求的客户，Linux 端席位授权也在 D3/D4 里。","risks":["⚠️ 品牌管理 17 项里绝大多数是 D3 起、且 D1/D2 全 ❌；把「专属钉钉」卖给 D2 客户是最常见的交付事故。","⚠️ Linux 端授权、超级部门在老专属版分别写作「Linux端授权」「APP定制」，属于原独立商品，需核对客户既有采购。","⚠️ 品牌类配置需要企业方设计与 IT 配合，交付周期与素材规范要提前约定，不是买完自动生效。","【知识库补充】APP 定制需绑定 D4 购买，且按人数单独购买（FAQ 原文：新底座卖的是产品能力，不是一次性服务）；F 版可与 D4 统一打包 APP。","【知识库补充】增购 APP 定制 / 混合云&合规 时按 D4 + F 版总坐席一起增购（例 100 D4 + 900 F → 需 1000 席）。","【口径冲突】APP 定制与混合云合规单价在《销售FAQ》两处写法互换（120/100 与 100/120），禁止口播单价，一律以报价工具/SOW 为准。","【知识库补充】APP 定制、混合云合规不支持售前试用（POC）；MDM（移动端设备管理）需同时购买 D4 和 APP 定制。"],"sources":["SRC-XLSX"]},"运营管理":{"what":"面向组织内部的信息触达与人群运营能力。","sell":["运营活动（组织文化、员工培训、应用推广等场景发起）与人群管理（自定义圈选人群，用于运营推送选人）：老专业版 ❌，D3 起提供。"],"talk":"如果客户 HR/党工/行政要主动做内部触达——发起运营活动、圈定人群定向推送，这一组跟品牌管理一起打包在 D3，是「自运营」能力的一部分。","risks":["⚠️ D1、D2 全部 ❌；且与通讯录里的「互动运营（服务台）」是两件事（服务台 D2 起才有数量），别说成一个东西。"],"sources":["SRC-XLSX"]}},"features":{"f6":{"hot":true,"keys":["人数","编制","能加多少人","扩容","105%","席位"],"talk":"您买 N 个人，通讯录能给到 N×105% 的编制，多出来那 5% 是给您留的换人缓冲；D1、D2 的购买人数上限是 1000，D3、D4 不设上限，但超过 500 人要先完成组织认证。","qa":[{"q":"我们 3000 人，能买 D2 吗？","a":"不能。对比表里 D1、D2 的通讯录是「购买人数×105%，购买人数≤1000」，官方公开口径同样是基础/高级两档最高购买 1000 人。3000 人要往 D3、D4 谈。"},{"q":"超编了怎么办？","a":"先按 105% 算清楚需求人数再报价；表里没有写「可付费扩容」的口径，我不能承诺超编处理办法，需要走后台与商品配置核实。"}],"risks":["⚠️ 老专属版底座是 ×110%，商业版是 ×105%：给专属版老客户算编制时不要沿用 110%。","⚠️ D3/D4 人数超过 500 需完成组织认证（官方口径），报价时提醒客户先做认证。"],"sources":["SRC-XLSX","SRC-PUB-AGENT"]},"f22":{"hot":true,"keys":["ding","加急","电话通知","短信","群发通知"],"talk":"DING 是按人头给量的：D1、D2 是 600 条 + 120 条×人头数，D3、D4 是 60000 条 + 120 条×人头数。您 500 人的公司，D1 就是 600+60000=60600 条一年，我先按这个公式帮您算，不会给您报一个虚数。","qa":[{"q":"免费标准版有多少 DING？","a":"对比表新标准版未认证/已认证均为 0 条/年，老标准版也是 0 条。也就是说只要客户用到电话/短信 DING，商业版就是必须项。"}],"risks":["⚠️ 不是「无限」，是公式量；引用时必须带人头数。","⚠️ 老专属版底座 5000 条为固定值，与商业版公式不同，不能直接对比大小（人数多时商业版更高，人数少时可能更低）。"]},"f24":{"hot":true,"keys":["群人数","多少人一个群","群上限","大群","全员群"],"talk":"四个商业版本内外部群上限都是 5000 人。要万人群，看 D3、D4（10000 人大群 ✅）；五万人超级群 D3、D4 各 5 个。","qa":[{"q":"专业版能到多少？","a":"对比表里老专业版写的是「1000（组织下所有群）」，老专属版底座是「10000（单群）」，新标准版是 1000。所以从 1000 提到 5000 是四档共有的升级点。"}],"risks":["⚠️ 万人群、5 万群只在 D3/D4；D1/D2 客户不要顺口承诺。"]},"f25":{"hot":true,"keys":["聊天记录","历史消息","存多久","换手机丢消息","数字资产"],"talk":"这是最能打动老板的一条：免费/老标准版文字只存 2 年，专业版文件 180 天后看不到；商业版 D1 起是「存多久看多久」，等于企业十几年的沟通资产真正留在组织里，可搜索、可追溯。","qa":[{"q":"云端搜索也一样吗？","a":"是的，第 26 行「聊天记录云端搜索」与新标准版同口径：新标准版文字 2 年/多媒体存多久看多久，D1 起统一为存多久看多久。"}],"risks":["⚠️ 保存时效跟存储容量挂钩（存储见第 31 行），别脱离存储承诺「永久保存」。"]},"f31":{"hot":true,"keys":["存储","空间","容量","不够用","钉盘","扩容"],"talk":"企业存储 D1 1.5T、D2 5T、D3 15T、D4 15T+30GB×人头数；这是企业总容量，四档都带容量看板，能看趋势和下钻。","qa":[{"q":"每人多少？","a":"没有人均口径，D4 才有按人头增量（30GB×人头数）。要按总人数估一下够不够，我可以现场算。"},{"q":"单文件多大？","a":"100GB，各版本一致，不用为这个加钱。"}],"risks":["⚠️ 存储总量 vs 人均口径别说错；客户要更多空间时，先确认是买更高档还是走增购（增购口径未在三源中给出，标待核实）。"]},"f37":{"hot":true,"keys":["排班","大小周","考勤组","双周循环","签到"],"talk":"高级考勤组（快速配置、大小周双周循环、签到同步、关联规则、考勤组分组管理）D2 起才有，D1 没有——有复杂排班的客户我会直接推 D2。","risks":["⚠️ 老专业版同样是 ❌，别说成「专业版有、新版砍了」，这是纯新增卖点。"]},"f38":{"hot":true,"keys":["防作弊","代打卡","虚拟定位","越狱","root","外勤"],"talk":"防作弊是 D2 起：能对疑似作弊直接禁止打卡，拦截低版本、系统篡改（越狱/root/穿越），支持按部门人员开启，还有实时提醒、员工侧警示标志、日周月报、外勤地址管控。对用工管理严的制造、连锁客户，这一条值回版本差价。","qa":[{"q":"D1 有吗？","a":"没有，防作弊和高级考勤组一样都是 D2 起的跳档项。"}]},"f45":{"hot":true,"keys":["并行审批","动态流程","流程版本","会签","流程预测"],"talk":"表单高级（自定义流水号、数据联动、公式、OCR）和流程高级（版本管理、动态流程、并行分支、节点角色多选、流程预测）从 D1 起就全给，新标准版这些是没有的。","qa":[{"q":"更复杂的退回、反审、跳过呢？","a":"那属于「流程高级配置」（第 46 行），老专业版也没有，D2 起提供。"}]},"f48":{"hot":true,"keys":["审批数据","附件批量导出","字段查询","限时体验"],"talk":"审批的数据管理高级能力、批量数据处理、审批自动化这三项（第 48–50 行），D2、D3 表里写的是「✅限时体验」，只有 D4 是正式 ✅。我不建议在限时体验上签承诺。","qa":[{"q":"限时体验会不会哪天就没了？","a":"有这个可能。我的口径是：D4 按正式权益交付，D2/D3 按限时体验交付并写在备注里；需要我把这条正式化时间问产品确认后再答复您。"}],"risks":["⚠️ 严禁把 D2/D3 的限时体验写成合同条款；三条同风险项：f48 数据管理、f49 批量处理、f50 审批自动化。"]},"f52":{"hot":true,"keys":["pdf","转word","转ppt","格式转换","office"],"talk":"PDF 转 docx/pptx 这类材料复用能力 D2 起提供（这次升级把原来单独卖的 Office 高级能力并进了版本体系）。","qa":[{"q":"能预览多大的 PDF？","a":"1GB，各版本一致，包括免费标准版。"}]},"f61":{"hot":true,"keys":["文档管理","治理","回收站","存储清理","离职转交","企业文档"],"talk":"D2 起是一套企业级文档治理：全局查找与管理文件、企业知识库管理、存储空间清理、企业文件回收站（恢复近 90 天删除）、协作数据看板、离职转交管理。买 D1 只有协同，买 D2 才有治理，这是 D1→D2 最好讲的差距。","risks":["⚠️ 这一组 6 项（第 60–65 行）在 D1 全部 ❌，别说成「商业版都有」。"]},"f95":{"hot":true,"keys":["会议时长","分钟","会议额度","视频会议","开多久"],"talk":"年度会议分钟额度：新标准版 100 万分钟，D1 100 万、D2 300 万、D3 1500 万、D4 1500 万+4000×人头数。同时 D1 起同时发起会议数不限、单场时长 24 小时、最高 1080P、摄像头不限、分组讨论 50 组。","qa":[{"q":"分钟额度用完了怎么办？","a":"额度是年度总量；超出后的处理口径（增购/降质）三源未明确，我需要按报价工具核实，不承诺自动扩容。"},{"q":"老专业版是多少？","a":"对比表写法是「支持选配：3 个 60 分钟 100 人标清会议室 + 2 个 24 小时 100 人高清云会议室」，属于选配，不是分钟额度口径，不能直接换算对比。"}],"risks":["⚠️ 「分钟」与「单场人数」是两个维度，客户常混淆；报价时两个数都要说。"]},"f96":{"hot":true,"keys":["多少人开会","100方","500方","1000方","会议人数"],"talk":"单场同时参会人数：新标准版 25 人（老标准版是 100 人，这条是免费版的减配点，要跟客户说清楚），D1 50 人、D2 100 人、D3 500 人、D4 1000 人。","qa":[{"q":"我们常开 300 人的全员会","a":"那要 D3（500 人）起；D2 只有 100 人。"}],"risks":["⚠️ 从老专业版（100 人）升到 D1（50 人）是降级，必须主动提示；这条是 D1 最常见的客诉来源。","【SOW 核定】SOW 列名为「视频会议用量（分钟/年）」，确认额度是年度总量；话术参考中出现过的「/月」写法不要引用。"]},"f110":{"hot":true,"keys":["rooms","会议室","一体机","投屏","硬件"],"talk":"智能会议室 Rooms 授权数：D1 2 个、D2 3 个、D3 5 个、D4 25 个（预订、签到与设备联动）。会议室预定系统本身 D1 起就有。","risks":["⚠️ Rooms 数量有明确上限且跨度大；客户有多个会议室时先数清点位再选档。硬件设备本身不含在版本内（需另行采购，口径待核实）。"]},"f111":{"hot":true,"keys":["电话拨入","pstn","手机拨号进会","座机入会"],"talk":"电话拨入是按年分钟额度给的：D1 没有，D2 1000 分钟/年、D3 2000、D4 3000。有外部客户/老年员工要拨号进会的，D1 满足不了。","risks":["⚠️ D1 ❌ 是最容易被忽略的一条；老专属版底座为 1000 分钟/年。"]},"f112":{"hot":true,"keys":["打印机","打印设备","点数","许可"],"talk":"云打印绑定设备数：D1–D3 各 300 台，D4 1000 台。注意老专业版是「不限许可」，所以打印点位多于 300 台的客户，升 D1/D2/D3 反而收紧，这类客户我会直接建议 D4 或先确认是否真用到那么多点位。","risks":["⚠️ 典型降级风险项，务必主动核对客户现有打印机数量。"]},"f126":{"hot":true,"keys":["行数","数据量","多维表","表格上限","卡"],"talk":"单数据表行数：D1 是 2 万行（限时）、D2 2 万行、D3/D4 5 万行。表格功能说明里提到最高可扩至 1000 万行，但那是能力上限说明，不是版本自带额度，我不拿它当版本权益承诺。","qa":[{"q":"1000 万行能不能用？","a":"需要单独确认开通条件与商品口径（三源未写清），我不能凭说明文字承诺。"}],"risks":["⚠️ 「2 万行（限时）」的限时口径待核实；AI 表格历史回溯 D2 起 365 天（第 128 行）。"]},"f131":{"hot":true,"keys":["api","接口","调用量","超限","对接","集成","被封"],"talk":"商业版四个档位的付费 API 调用量都是无上限，这是官方公告明确写的；同时 QPS 60。参照值：老标准版 5000/月→新标准版 1 万/月，老专业版 20 万次/自然月，老专属版 550 万次。","qa":[{"q":"无上限是不是包括连接流？","a":"不是。连接流节点执行量是分档位的：D1 700/月、D2 50 万、D3 100 万、D4 250 万+60×购买人数。做自动化要看这条。"}],"risks":["⚠️ 「无上限」仅指付费 API 调用量；Webhook&Stream 从新标准版起也已无上限（第 132 行）。","⚠️ 官方公告还保留「连接流增购包」的独立购买方式，涉及增购时以开发者后台用量与客户经理报价为准。"],"sources":["SRC-XLSX","SRC-PUB-OPEN"]},"f134":{"hot":true,"keys":["连接流","自动化","ipaas","节点执行","流程触发次数"],"talk":"连接流节点执行量是最需要按场景选档的一项：D1 只有 700 次/月（跟免费版一个量级），要跑跨系统自动化至少 D2 的 50 万/月，集团级看 D4 的 250 万+60×人数。","risks":["⚠️ 别把「API 无上限」当成自动化无上限；D1 客户做连接流极易撞 700 次/月。"]},"f141":{"hot":true,"keys":["误删","恢复","找回","数据恢复","群解散"],"talk":"自助数据恢复 D1 起给到 1 万次（流程误删、文件误删、群解散、DING/消息撤回、重置群主），对比老专业版的 30 次是数量级提升。要人工介入恢复，那是 D3、D4 各 10 次。","risks":["⚠️ 人工数据恢复 D1/D2 ❌；自助恢复次数别与客户已有的「专属版」次数混算。"]},"f148":{"hot":true,"keys":["sso","单点登录","okta","ad","身份源","统一登录"],"talk":"SSO 单点登录、企业账号管控、两步验证、密码策略这一组是 D3 起（老专业版没有，老专属版底座有）。IT 强管控需求的客户，从这里开始就是 D3 的天下。","risks":["⚠️ D1、D2 都没有 SSO，这是高频误承诺点。"]},"f178":{"hot":true,"keys":["水印","明水印","截屏警示","溯源"],"talk":"全局明水印（可配内容、深浅、疏密）D3 起；肉眼看不见、事后可解析定位到人的全局暗水印 D4 才有。客户说「我们要能查到是谁泄的」，指向的是 D4。","qa":[{"q":"保密群 D1 有没有？","a":"有。企业文件护盾、保密群（防转发/移动端防截屏录屏/群内水印）D1 起就有，但成套的文档与钉内文件管控要到 D3。"}]},"f179":{"hot":true,"keys":["暗水印","隐形水印","防截屏","防录屏","粘贴限制","敏感词","密钥","kms"],"talk":"D4 独有的数据防泄五件套：全局暗水印、全局防录防截、全局粘贴管控、敏感词管理、企业密钥管理。这五条基本是政企、金融、研发类客户的硬性门槛，也是 D4 定价的支撑点。","risks":["⚠️ 企业密钥管理写明需要购买三方云厂商 KMS 服务，是「版本提供入口 + 三方成本」，报价要拆开说。"]},"f185":{"hot":true,"keys":["dlp","数据密级","分级保护","三色管控","访问控制中心","策略引擎"],"talk":"安全引擎四项（数据密级标签、DLP 规则配置、访问控制中心、三色管控）全部 D4 独占。客户要的是「按密级自动决定谁能看、能不能流转」，这就是 D4 的立身能力；进一步还能把三色管控的判断对接客户自有 DLP（第 190 行，D3 起提供入口）。","risks":["⚠️ 老专属版这些项写作「访问&数据安全」独立商品；确认客户是否已单独采购，避免重复或漏配。"]},"f201":{"hot":true,"keys":["信创","国产化","麒麟","统信","linux","政采"],"talk":"Linux 端授权（企业自主分配信创端席位）D3、D4 提供，跟专属品牌、安全管控一起打包。有信创合规要求的客户，这一条经常直接决定档位。","risks":["⚠️ 老专属版写作「Linux端授权」独立商品（对应返佣表 DT_GOODS_Linux），迁移客户要核对既有授权与商业版档位的覆盖关系。"]},"f207":{"hot":true,"keys":["专属钉钉","主题色","logo","开屏","品牌","我们的钉钉"],"talk":"「换成客户自己的钉钉」这一整套（主题色、Logo、开机启动图、导航栏、+号菜单、吸顶栏、顶部工具栏、推送号关闭、AI 助手入口配置、专属表情包/表情雨/文字表情/通话海报）老专业版全部没有，D3 起成套提供。给老板演示时，这一组是最直观的视觉价值。","risks":["⚠️ 品牌类 17 项在 D1、D2 全部 ❌，且需要企业方提供 VI 素材并配合配置，交付周期要提前约定。"]},"f68":{"hot":true,"keys":["邮箱账号数","企业邮箱","几个邮箱"],"talk":"企业邮箱是随商业版本底座走的，不用再单独买一套：可用邮箱账号数按您购买的底座人数的 105% 发放（SOW 口径），F 版成员不占、也不赠送邮箱账号。","qa":[{"q":"邮箱账号数到底等于什么？","a":"本地对比表写「底座账号数」，SOW 明确为「购买人数×105%」；F 版列为 ❌（不赠送）。按 SOW 口径回答，并在报价单里写清数量。"},{"q":"F 版员工能用邮箱吗？","a":"邮箱账号数不随 F 版发放；但底座发放的账号（含 365 会员、Exchange 同步、Linux 授权）可以分配给 F 版成员使用，总量仍等于底座账号数。"}],"risks":["⚠️ 该模块 27 项在 D1–D4 基本同值，说明邮箱不是版本跳档项，别用它论证「必须买高档」。","⚠️ 商业版含的是「钉钉企业邮箱基础版」，客户要更大附件/专属域名/私有化邮箱时，需另行核对增购或独立商品。"],"sources":["SRC-XLSX","SRC-SOW"]},"f9":{"hot":true,"keys":["高管保护","高管静音","老板被打扰","屏蔽普通员工"],"risks":["【SOW 核定】SOW 明确：高管保护 D1 100、D2 500、D3/D4 5000，F 版跟随商业版本权益。"]}},"pages":{"vcards":{"D1":{"role":"小型团队起步：资源扩容 + 基础协同 + AI 应用。〔话术参考〕适用画像：1000 人以内的初创及成长型企业、标准化协作组织、预算有限但要完整办公能力、有简单系统对接。","points":["400 元/人/年 ｜ 存储 1.5T ｜ 会议 100 万分钟、单场 50 人、24 小时","API 无上限、QPS 60、连接流 700 次/月","聊天记录与文档历史存多久看多久；含企业邮箱、云打印、数据恢复","不含（需更高档）：智能人事、高级考勤、OA 高级配置、企业文档治理、SSO、专属品牌","起订：不限席位；1000 人以上组织不可购买 D1"]},"D2":{"role":"成长型企业主力档，官方话术定位「综合性价比最高」。〔话术参考〕画像：1000 人以内业务快速增长、知识密集、对考勤/人事/OA 有高级需求、集成量大。","points":["640 元/人/年（比 D1 多 240）｜ 存储 5T ｜ 会议单场 100 人","高级考勤组 + 考勤防作弊、智能人事四项、OA 流程高级配置","企业文档治理：文档管理/回收站/存储清理/离职转交/协作看板、PDF 转 Office","AI 表格高级：50 个联表图表、50 个自定义角色、千人千面、跨表同步、365 天回溯","连接流 50 万次/月（D1 的 700 次是质的差别）、PSTN 1000 分钟/年、Rooms 3 个","起订 20 席位；1000 人以上不可购买"]},"D3":{"role":"中大型组织首选：专属开放集成 + 专属安全 + 专属品牌运营。〔话术参考〕画像：1000 人以上、多组织多地域、有安全合规诉求、正在用或考虑飞书企业版。","points":["960 元/人/年 ｜ 存储 15T ｜ 会议 1500 万分钟、单场 500 人","通讯录无规模上限（购买人数×105%，不封顶）；>500 人需组织认证","账号安全与准入：SSO、企业账号管控、两步验证、登录/锁屏/版本管控","数据防泄成套 + 全局明水印 + 离职数据管理；安全运营（风险管理/预警事件）","专属品牌 17 项 + Linux 端授权 + 超级部门 + 运营活动/人群管理","可搭配 F 版；底座 + F 版组合时底座起订 100 席位"]},"D4":{"role":"钉钉的天花板版本：完整安全运营与访问&数据安全，资源随人数扩容。〔话术参考〕画像：1000 人以上大型企业、对数据安全/合规/定制化要求极高。","points":["1760 元/人/年 ｜ 存储 15T + 30GB×人头 ｜ 会议单场 1000 人","连接流（250 万 + 60×人头）次/月；五万人超级群、10000 人大群","D4 独占：数据密级标签、DLP、访问控制中心、三色管控、暗水印、防录防截、粘贴管控、敏感词、企业密钥","D4 独占管控：行为预警、自动管控列表、群管控、DING 管控、VIP 人群管控","仅 D4 可增购 APP 定制、混合云&合规、移动端设备管理 MDM","单独新购/续费 D4 付款后不会自动开通，需走交付平台并购买交付服务"]}},"pitch":{"title":"版本推荐与官方话术","intro":"版本定位（《核心价值highlight》原文）：AI基础版=初创企业一体化办公 ｜ AI高级版=快速增长型企业提效与治理 ｜ AI尊享版=中大型集团协同与安全 ｜ AI旗舰版=大型集团旗舰安全与合规。以下话术取自内部《【钉钉商业版本】销售话术参考》，原文注明：若其中所列权益与 SOW 不符，以最新 SOW 为准。带数字的部分我在「口径冲突清单」里标注了与 SOW/对比表不一致的地方，报价前请核对。","cards":[{"h":"开场破冰（先问规模与痛点，再推版本）","lines":["「了解到贵公司目前在用钉钉的免费版/专业版。钉钉在 10 月份做了商品体系的全面升级，新版本不仅保留了免费版，还在会议、AI、存储等方面做了大幅增强。我想花几分钟介绍一下新方案，看看能不能帮贵公司进一步提效。」","「请问贵公司目前大约多少人在用钉钉？平时开会、文档协作、数据管理用得多吗？」","「根据您说的情况，我帮您算一下哪个版本性价比最高——不一定是最贵的才好，适合的才好。」","要点：先了解规模和痛点，再推荐版本，避免上来就推 AI 旗舰版。"]},{"h":"AI 基础版 D1 · 400 元/人/年","lines":["一句话卖点（原文）：每天不到 1 块 1，解锁完整企业办公能力，存储 1.5T、会议 100 万分钟、API 无上限，还送每人 200 元千问办公积分。","对客表达：「会议方面，免费版单场 25 人，有时不够用。AI 基础版直接到 50 人，单场可以开 24 小时，不用担心超时。」","「存储从 100GB 扩到 1.5TB，是 15 倍，传资料再也不用担心空间不够。」","对比要点：强调量变到质变——存储、会议、邮箱等刚需同时升级。","提醒：原文画像里写「不需要高级 AI、高级考勤、高级 OA 等功能」——客户一旦提到人事/考勤/文档治理，就该转 D2。"]},{"h":"AI 高级版 D2 · 640 元/人/年（主推）","lines":["一句话卖点（原文）：综合性价比最高——比 D1 多 240 块，多了 AI 表格高级能力、Office 高级能力、考勤/人事/OA 高级能力，连接流从 700 次跳到 50 万次，存储 1.5T→5T，会议 50 人→100 人。","「如果您的团队在考勤排班、人事管理、OA 审批上有比较复杂的流程需求，我强烈建议直接上 AI 高级版。连接流从 700 次直接到 50 万次，这不是量的变化，是质的飞跃。这些能力单买都不止这个价，再加上 300 块的千问办公积分，综合性价比是所有版本里最高的。」","「每人每月多花 20 块钱，存储翻 3 倍、会议时长翻 3 倍、参会人数翻倍。」","对比要点：客户犹豫 D1 还是 D2 时，重点讲连接流与高级能力的差距。"]},{"h":"AI 尊享版 D3 · 960 元/人/年","lines":["一句话卖点（原文）：中大型组织首选——15T 存储、500 人会议、100 万次连接流，更拥有专属开放集成、专属安全与专属品牌运营，是和飞书企业版直接对标的版本。","「贵公司几千人，专业版最多 1000 人席位，直接不够用。AI 尊享版不限规模，按你们实际人数买就行。」","「500 人同时参会，全公司大会都没问题；15TB + 100 万连接流 + API 无上限，你们有 IT 团队做集成开发，API 无上限这点非常关键。」","「对标飞书企业标准版 1320 块，我们便宜了 27%。」（竞品数字出自话术参考，报价前用《竞品对比（vs飞书）》核实）","对比要点：解决大企业对资源封顶和数据安全的焦虑——「不限规模」「无上限」「企业安全」「品牌自定义」「开放集成」。"]},{"h":"AI 旗舰版 D4 · 1760 元/人/年","lines":["一句话卖点（原文）：钉钉的天花板版本——15T + 弹性存储、千人会议、完整安全运营和访问数据安全，打造企业专属的协作和 AI 工作平台。","「AI 旗舰版是面向大型企业的高阶版本，资源是按人头加量的——存储、会议时长、连接流都随人数增长，人越多越值。」","「千人团队光存储就有 45TB，会议时长 5500 万分钟。」（45TB = 15T + 30GB×1000；5500 万 = 1500 万 + 4000×1000，均按对比表公式算得）","「AI 旗舰版有完整的访问数据安全和安全运营能力，这是其他版本没有的。对标飞书旗舰版 2640 块，我们 1760 块，便宜 33%，AI 积分每人直接送 600 块。」","关键差异化（原文）：① 超大规模资源 ② 深度数据防泄 ③ 零信任与终端网络管控 ④ 高级扩展（支持 F 版、品牌定制、数据私有化）。","⚠️ 交付提醒：单独新购/续费 D4 付款后不自动开通，必须走交付平台并购买交付服务（详见「D4 开通与 POC」）。"]},{"h":"F 版 一线员工版 · 80 元/人/年","lines":["一句话卖点（原文）：80 块钱给一线员工一个正式席位，共享企业所有资源，PC 端移动端都能用。","「您企业 5000 人，其中 3000 人是一线员工，不需要完整办公功能，但需要正式使用身份。F 版每人每年 80 块，共享 AI 尊享版/旗舰版的全部企业资源，PC 和手机都能用。」（原文对标：飞书一线专业版 360 块）","内部提示（原文）：F 版必须绑定 AI 尊享版或 AI 旗舰版购买，不能单独销售；F 版是扩大购买人数覆盖、实现全员化的关键产品。","⚠️ 限制项必须提前说：会议 60 分钟/25 人、云文档每月新建 3 次、不可直播、不可创建日程。"]},{"h":"升级通用话术（原文）","lines":["「新底座版本比单独购买各个功能模块划算得多。您之前可能单独买了存储、买了会议、买了各种增值功能，现在一个版本全包了，还送 AI 积分。升级不仅是换个版本，是整体获得感的提升。」","vs 飞书一句话（FAQ 官方口径）：打造 AI 组织，最优性价比的选择。"]}],"risks":["⚠️ 话术参考里的会议额度单位写法与对比表不一致（原文 D2 写「300 万分钟/月」、D3 写「1500 万分钟/月」，而对比表列名是「/年」，D4 原文又写「/年」）。对客统一按「年度额度」表述，并在报价前以 SOW 复核。","⚠️ 原文「高管保护 1000 人」与对比表 D3/D4 的 5000 人不一致，见冲突清单。","⚠️ 竞品价格（飞书 1320/2640/360）只出现在话术参考中，属于内部对比材料，引用前先核对《竞品对比（vs飞书）》是否已更新。"],"srcNote":"来源：SRC-INT-KB《【钉钉商业版本】销售话术参考》《【钉钉商业版本】销售FAQ》+ 本地对比表数值交叉核对。"},"standard":{"title":"新标准版（免费）权益变化与撞墙点","intro":"免费标准版继续存在，但相比老标准版是多处收紧的。这一段用来回答「我没花钱是不是照样用」——答案是核心协同还在，但容量与高级能力都撞墙了，这是最正当的升级理由。","table":{"title":"标准版权益调整（来源：销售FAQ）","head":["权益项","调整前","调整后","变化"],"rows":[["通讯录（认证后）","最高 10 万人","1000 人","下调（未认证 500 人）"],["视频会议单场人数","100 人","25 人","下调"],["视频会议总时长","不限","100 万分钟/年","新增强制额度"],["直播总时长","—","3000 分钟/年","额度"],["付费 API 接口调用量","5000 次/月","10000 次/月","上调"],["Webhook & Stream","3000 次/月","不限制","上调"],["连接流节点执行量","500 次/月","700 次/月","上调"],["【普通群】文件临时存储","90 天","30 天","缩短（11 月生效，与通讯录、音视频错峰）"],["聊天记录保存","文字 2 年 / 多媒体存多久看多久","文字 2 年 / 多媒体存多久看多久","商业版才是「存多久看多久」"],["单场会议时长","60 分钟","60 分钟","同时发起 3 个会议"]],"note":"以上「调整前/调整后」为销售FAQ原文；最后三行取自本地对比表第 25/95/97/98 行与发布节奏文档。"},"cards":[{"h":"客户会说「那我继续用免费的不行吗」，怎么答","lines":["不是不让您用，是额度会撞墙：认证后通讯录只有 1000 人、单场会议 25 人 60 分钟、群文件 30 天后就看不到了、连接流 700 次/月、API 1 万次/月。您人再多、会再多、文件再多，就会开始受影响。","组织人数超 1000 的客户：不会主动清人，但无法再新增员工，系统提示增购后才能继续加人。","钉钉采用逐步放量方式，不会一次性撞墙；过程中客户反馈可通过问题反馈渠道及时上报。"]},{"h":"哪些客户暂时不受影响（别乱吓客户）","lines":["教育（含教育局、K12、高校）与政府组织：通讯录、钉钉上下级、音视频权益暂不受影响，行业升级方案后续发布；是否可以买新底座：与普通组织规则一致，可买。","医疗行业组织：本次调整暂不影响其现有通讯录、钉钉上下级和音视频权益。","使用国内客户端的海外组织：通讯录、音视频权益保持不变，其他用量按新商业化规则执行。","使用海外 DingTalk 客户端的海外组织：本次调整不涉及；但海外组织不可以购买新底座。"]}],"srcNote":"来源：SRC-INT-KB《【钉钉商业版本】销售FAQ》《钉钉商业版本发布节奏及客户处理》+ 本地对比表。"},"rules":{"title":"售卖与交易规则（下单前必查）","intro":"商品：钉钉商业版本 / 钉钉底座，商品 code DT_GOODS_DINGTALK，商机 code DDDZ，1 CODE - 4 SKU，可平滑升级、增购，合约期不可降级。","table":{"title":"SKU 对照","head":["版本","商品 SKU","价格","学考授权"],"rows":[["AI 基础版（D1）","DT_GOODS_DINGTALK_1","400 元/人/年","必学必考：钉钉商业版本销售初级认证"],["AI 高级版（D2）","DT_GOODS_DINGTALK_2","640 元/人/年","选修（见学考文档表格）"],["AI 尊享版（D3）","DT_GOODS_DINGTALK_3","960 元/人/年","选修（见学考文档表格）"],["AI 旗舰版（D4）","DT_GOODS_DINGTALK_4","1760 元/人/年","需「钉钉商业版本交付高级认证」（原文：10.21 后由专属钉钉售卖权变更）"],["F 版","新底座增购品（DT_GOODS_DZFrontline）","80 元/人/年","需绑定 D3 或 D4"],["标准版","免费","0","—"]],"note":"学考列为《底座销售权限与学考要求》原文表内容，原文是横向表格、列对应关系可能存在偏差，正式授权要求以该文档与学习平台为准。已确认要点：10.21 起下单新底座必须持有「钉钉商业版本销售初级认证」证书；证书自获取后 6 个月内有效、次日早 7 点生效；专业版证书不可申请新底座授权；旧版底座学考 10.21 统一关闭；10.21 起 AI 基础版改为必备品。"},"cards":[{"h":"一企一版本与人数校验（最容易踩）","lines":["一个组织只能选择一个版本，不能同时买两档；也不支持「部分成员商业版席位 + 部分成员免费标准版」的混合模式。","一个组织，D1-D4 只能买一个版本；老专业版、专属版与新底座也只能同时买一个。","下单时系统校验：企业购买人数必须 ≥ 通讯录实际人数，少于实际人数无法下单。例：组织通讯录 100 人，必须买 ≥100 席。","购买商业版本后通讯录上限给 105% buffer（买 100 席，上限 105 人）。","不能「先清人再拉回」：买 100 席后通讯录上限锁 105 人，超出无法加人，系统提示增购。","1000 人以上组织只可购买 D3/D4，不可购买 D1/D2。","上下级组织：完成年检认证的上级组织按商业版本自动获赠「上级可邀请关联的总额度」；下级需自行购买商业版本才具备关联与同步能力，下级人数不计入上级。"]},{"h":"起订量与年限","lines":["AI 基础版（D1）不限制起订量；D2、D3、D4 起订 20 席位。","D3/D4 若要叠加 F 版，底座账号起订量不少于 100 席位；且（D3/D4 + F）合计席位数须 ≥ 通讯录人数。例：100 人公司不能买 1 个 D3 + 99 个 F。","当前可购年限支持 1-3 年。首次买 1 年，后续增购/升级只能 1 年；首次买 3 年，后续只能 3 年（除非退款）。续签时可以换规格和年限重新选配。"]},{"h":"升级 / 降级 / 减席 / 差价","lines":["合约期内不允许降级；只能从低到高升级。降配（如 D4→D3）系统不支持，需要退款重下。","买了 200 席要减到 100 席：不可以，需退款后重新拍。","中途加人（版本不变）：单价 × 新增人数 × 剩余月数 / 12。例：1 月 1 日买 100 人 D1，3 月 1 日加 50 人 = 400×50×10/12 = ¥16,667。","中途升版本：(新版价 − 旧版价) × 原人数 × 剩余月数 / 12 + 新版价 × 新增人数 × 剩余月数 / 12。例：6 月 1 日从 D1(150 人) 升 D2 并增购 30 人 = (640−400)×150×5/12 + 640×30×5/12 = ¥15,000 + ¥8,000 = ¥23,000。","系统根据单价及剩余时长自动算差价，报价时以如下单页为准。"]},{"h":"在约老底座客户：不能直接买新底座","lines":["在约专业版/专属版组织与新底座通讯录权益冲突，需先退款再购买新底座；「老底座直接升级新底座」的产品方案推进中（请留意后续通知）。","老客户迁移路径：退掉老订单 → 购买新底座。","已成单专业版客户不必须升级：合约期内权益不受影响；2027.9.30 前进入续签期的可再续 1 次（最长 1 年）；到期后引导升级新底座。","老专属（FY24 版）与新底座是两个不同商品，系统内不存在升级关系，需老订单退款后再购新底座。"]},{"h":"服务与交付边界（别把服务说成自带）","lines":["目前产品定价包含基础的客满服务，不包含交付服务和 CSM 服务；客户有需求需单独增购。","定价是否区分白领/蓝领：蓝领/一线员工建议按 F 版（80 元/人/年），须绑定 D3 或 D4。","每个坐席等同一个企业账号：买 N 席即可加 N 个企业账号，坐席可绑钉钉账号也可绑企业账号，不做区分。","容量按组织算，不存在个人分摊。"]}],"srcNote":"来源：SRC-INT-KB《钉钉商业版本售卖规则》《【钉钉商业版本】销售FAQ》《底座销售权限与学考要求》。"},"timeline":{"title":"停售与老客户处理时间线","intro":"回答「什么时候生效」「老的可能不能买了吗」这两类问题必须按时间线说，不要凭印象。","table":{"title":"关键节点","head":["时间","发生了什么","对在约客户的影响"],"rows":[["2026.9.21","公告期，试卖启动；开始对客公告（OA 后台首页、通讯录成员管理、智能人事、音视频/连接流/开发者后台公告位、群聊侧边栏等）","标准版降权尚未生效"],["2026.10.8 起","客户采购流程未走完的，可通过 OA 审批-工作台-停售商品下单开白申请发起报备","10.21 前有采购意向/报价/招投标的项目可报备"],["2026.10.21","生效期，正式开售：专业版、专属版等单品停售，统一引导商业版本；标准版降权开始生效；新底座持证下单；旧版底座学考关闭；AI 基础版改为必备品","老专业版/专属版客户合约期内权益不受影响"],["2026.11.30","报备项目完成付款或合同签约的截止日，逾期不可订购老版","报备只保留老报价售卖资格，非永久授权"],["2026.12.31","「买商业版送千问办公席位 + 积分」活动截止（须下单且支付成功）","续费不再额外赠送积分"],["2027.9.30","旧底座续签截止，随后完全退市；此前进入续签期的可续 1 次、最长 1 年","C 类商品在此之前可续签与增购但不可新签"],["11 月（错峰）","普通群文件临时存储时长 90 天 → 30 天生效，与通讯录、音视频错峰","高敏行业另行安排"]],"note":"来源：《钉钉商业版本发布节奏及客户处理》《销售FAQ》。原文注明「10.21 起，升&降权分批次生效」，因此对客户不要承诺具体某一天全体生效。"},"cards":[{"h":"商品分类与可操作范围（原文口径）","lines":["专业版/专属版新签：10 月 21 日起停止新签，对新客户端只传递新服务新价格，仅支持售卖钉钉新商业版本（新底座）。","专业版/专属版续签：2026.10.21-2027.9.30 期间进入续签期的客户，可续费老品 1 次，最长 1 年。","单品新签：10.21 前，当前在售单品可正常新签、续约、增购，遵循当前交易规则。","单品续签：10.21 后，单品付费期内客户权益不受影响，可享受至合同履约结束；融入底座的单品停售，需购买商业版本后使用；底座增购单品需先购买商业版本才可购买。","C 类商品（原底座及部分用量单品）：允许在 2027.9.30 前续签和增购，不可新签。D 类商品（被底座合并的单品）：按退市过渡处理。","被底座融合的单品范围（原文举例）：Office 套件、AI 表格、PaaS（连接流增购包）、智能人事高级版、假勤（一方部分）、智能 OA、上下级、云打印、日历 Exchange 同步等；底座增购单品：钉盘、会议（时长、方数）、AI 表格行数、DING 等。"]},{"h":"特批与报备通道（内部流程，别对客户承诺结果）","lines":["底座特批通道：报备后可买老底座。停售 code 特批通道：报备后可买停售 code。","专属版年框 3 年的客户：需在 10.21 之前报备并提供合同，报备后可按合同约定续约（专属版 2027.9.30 后退市，续约需在该时间点前完成）。","专属版在约客户买了 1 年 AI 表格后要增购：10.21 前老底座在约客户如客户诉求强烈、有舆情或流失风险，提供书面证明与沟通记录特殊报备，报备后单品可续约。","老专属钉续费不限制提前时间（专业版最多提前 120 天）。"]},{"h":"单品的去与留（10.21 之后）","lines":["标准版（免费版）用户：不可再购买底座内的单品，需先购买新底座。专业版、专属版在约客户仍可正常购买。","100 方云会议室 Rooms 权益：10.21 后不再单独售卖，需通过底座 + 对应增购能力实现。","网盘 / API 等增购包：10.21 之前可购买；之后不再单独售卖，需先升级底座再增购。","钉钉直播单品：10.21 后依旧可单独购买；标准版含 3000 分钟/年标清直播权益。","会议时长包、钉盘扩容包等：走增购品下单，各有独立 SKU、独立扣款。","已付费在约的单品客户（如 AI 表格撞通讯录墙）：合约期内权益不受影响可继续使用，到期后引导升级新底座。","老 AI 表格多年单品客户升级到 D2 及以上：不做退款/折算，建议通过折扣策略引导升级。","老专业版/专属版已购的流量增购包：不会合并到新底座归属人名下，存量商机与订单不动。"]}],"srcNote":"来源：SRC-INT-KB《钉钉商业版本发布节奏及客户处理》《【钉钉商业版本】销售FAQ》。"},"d4":{"title":"D4 开通、试用（POC）与交付","intro":"D4 是唯一「付款后不自动开通」的版本，也是唯一支持售前试用（POC）的底座版本。这块讲错会直接影响交付与客户体感。","cards":[{"h":"开通与交付规则","lines":["单独新购、续费 AI 旗舰版（D4）：付款后不会自动开通，需走交付平台开通。","D4 必须购买原厂交付服务（商品：新底座原厂交付服务 DT_GOODS_DINGTALKService），《SOW》Sheet「D4交付服务定价」标注合计 180000 元，含原「专属钉底座」交付服务 + 原「访问&数据安全」交付服务；与席位数无关。","交付范围（SOW 原文）：通讯录导入、部门管理、通讯录高级设置、专属设计服务、降噪管理配置、专属安全服务、全局暗水印、防录屏截屏、敏感词、三色管控、可信设备、IP 围栏；明确不含专属网络代理与企业应用网关的交付；图标/图片素材的设计与准备、系统对接类导入均不含。","已购 D1/D2/D3 后升级到 D4：下单后直接开通（重点：此场景直接开通功能）。风险是直接开通后即开始计算服务时长，而客户可能还在交付测试阶段；只能通过先退再买解决。","已开通 D3、D4 的新底座，再增购其他商品：全部直接开通。","D4 必须购买交付服务（DT_GOODS_DINGTALKService），不管几个席位都要买；目前下单的是原厂交付，后续可开放给有交付资质的服务商（需经学考授权）。","免交付服务例外：原专属钉客户且已购买开通「访问&数据安全」产品的客户，无需购买 D4 交付服务；后续 D4 续费或增购也无需再购买交付服务。","交付服务内容：主要为原「专属钉底座」交付服务与原「访问&数据安全」交付服务，SOW 内容有所增加更新。","退款：D4 退款不会自动关闭功能，需小二走线下关闭流程（交付平台 → 交付支持 → 专属钉钉关闭，仅支持组织整体关闭）；D1/D2/D3 退款自动关闭；F 版、APP 定制、混合云合规、人脸比对次数、病毒扫描次数等增购品退款自动关闭。","线上/线下不可混用：走线上订单开通后无法走线下延期，要么全部线上，要么全部线下。"]},{"h":"售前试用（POC）规则","lines":["仅 AI 旗舰版（D4）与新 F 版支持售前试用；D1、D2、D3 没有 POC 流程，下单后自动开通。","混合云合规、APP 定制不支持售前试用。","售前试用开通时以下权益不发放（即保持客户现状不变）：通讯录人数、365 会员、短信电话 DING、视频会议用量、电话拨入、直播用量、钉盘、同时参会人数、直播观看人数、AI 算粒、千问积分。⚠️ 这意味着试用阶段不要给客户演示「扩容后效果」。","专业版/专属版在约客户虽然不能购买新底座，但可以开 D4 售前试用。","正在售前试用 D4 期间，可以随时下单购买任何版本（试用、提前交付阶段背后没有订单）。","试用结束若不买：权益中心自动回收，功能不可用、不可进入。","提前交付阶段按购买订单完整数量发放权益，用完后不影响正式开通后的权益；进入正式交付/正式开通会关闭提前交付权益并按订单重新发放一轮。","F 版不能单独售前试用：已购 D3 则 F 版只能正式开通；计划购买 D4 时，在勾选底座售前试用前提下可选 F 版售前试用，且 F 版试用结束时间与底座保持一致。"]},{"h":"POC 申请流程（内部）","lines":["第一步：销售提交试用开白名单（《AI旗舰版D4试用开白（POC权限申请）》，对接人 @罗子仪(露帕)）。","第二步：开通交付平台白名单（@林朋(解识)）；成功后【交付平台-项目-开通】后台出现功能模块下的【钉钉旗舰版】，如未出现请刷新浏览器、清除缓存。","第三步：开通新底座 OA 后台白名单（@周颖婷(栗鸢)）。","第四步：销售在交付平台自行完成 POC 申请：https://tesla.dingtalk.com/project","说明：《AI旗舰版D4开通说明（含POC）》与《销售FAQ》对第三、四步描述略有差异（开通说明为三步、FAQ 为四步），以最新文档与交付平台实际流程为准。"]}],"srcNote":"来源：SRC-INT-KB《【钉钉商业版本】AI旗舰版（D4）开通说明（含POC）》《【钉钉商业版本】销售FAQ》。本页含内部对接人信息，面客时请勿展示姓名与内部链接。"},"ai":{"intro":"四个商业版本全系接入千问办公：购买任意商业版本赠送千问办公企业座席（价值 980 元/人/年，SaaS 版），全员可用；并按版本与购买人数赠送积分。这是本次升级对外最强的一张牌，但规则细节必须说准。","points":{"D1":"4,000 积分 × 购买人数（价值 200 元/人，相当于目录价 50%）","D2":"6,000 积分 × 购买人数（价值 300 元/人，47%）","D3":"8,000 积分 × 购买人数（价值 400 元/人，42%）","D4":"12,000 积分 × 购买人数（价值 600 元/人，34%）"},"notes":{"D1":"F 版另计：800 积分 × F 版购买人数（价值 40 元/人，占目录价 50%）","D2":"积分发放至组织，可组织内共享、全员共用；默认限额按首次发放时的版本 4000/6000/8000/12000","D3":"管理员可在企业管理后台调整成员可用积分限额，每个账号限额下限 500 积分，不能设置为 0","D4":"席位为 SaaS 版，不含 VPC 与私有化版本；不能折价换 VPC 坐席"},"featureIds":["f129","f130","f21","f20","f199"],"talk":"您买商业版不是只买协同工具，是买一套人和数字员工一起干活的底座：四个版本都送千问办公企业座席（价值 980 元/人年，全员可用），并按人头送积分——D1 4000、D2 6000、D3 8000、D4 12000 积分每人。同时原来要单独买的 Office 套件高级能力、AI 表格高级功能现在都并进版本了。积分赠送是限时活动，截止 2026 年 12 月 31 日下单并支付成功，这一点我可以帮您把时间算清楚。","risks":["⚠️ 积分自「钉钉商业版本」正式开通日下发，有效期 3 个自然月，过期不结转；不可申请延期。","⚠️ 这是面向新底座席位首购的优惠：席位续费不再额外赠送积分；买 1 年和买 3 年赠送额度一样；扩席或升级会增补发放对应积分。","⚠️ 生效时间差异：席位 D1-D4 从订单支付时间起开通；积分 D1-D3 从支付时间起开通，D4 从正式开通时间起开通（售前试用、提前交付阶段不开）。","⚠️ 商业版本不包含 AI 听记权益，需单独购买；AI 听记消耗 AI 算力/千问积分，与视频会议时长包独立结算。","⚠️ 不额外赠送钉钉算粒；钉钉算粒与千问积分暂未打通（官方口径：后续统一成千问积分）。对比表里写「消耗算粒」的 AI 能力，现阶段仍按算粒结算。","⚠️ 积分用完：可按需增购千问办公积分包，需通过阿里云销售渠道下单；赠送积分不需在阿里云下单，与阿里云侧商机不冲突。","⚠️ 赠送席位有效期与所购底座一致；集成的是账号，与端无关（网页/钉钉/PC 都能登录）。","⚠️ 客户已自购千问席位的情况：不支持退款，两个版本可同时使用，赠送积分用完后仍可继续用自己购买的坐席与积分。"],"pending":"待核实：钉钉算粒统一成千问积分的时间点；数字员工/企业上下文（Enterprise Context）随版本开放的边界；千问办公积分包的具体规格与单价。","srcNote":"来源：SRC-INT-KB《买【钉钉商业版本】送千问办公权益说明》《【钉钉商业版本】销售FAQ》+ 官方公开发布报道。"},"f":{"intro":"F 版是面向一线员工的精简版本（类似飞书蓝领版）：共享企业资源、支持 PC 与移动端，但限制部分功能。定价 80 元/人/年（老 F 版 39 元），不可独立购买，必须绑定 AI 尊享版（D3）或 AI 旗舰版（D4）。","table":{"title":"F 版关键限制（对客必须说清）","head":["功能","老 F 版","新 F 版","销售提示"],"rows":[["登录端","仅移动端","移动端 + PC 端","这是新 F 版最大的体感改善"],["发起会议","不可","可发起，限 25 方 / 60 分钟","别按底座会议额度承诺"],["参加会议","可以","可以","—"],["云文档新建（含 AI 表格）","可以","每月最多新建 3 份，本地文件转在线文档也计入额度","一线同事最容易撞的限制"],["创建日程","可以","不可","老 F 版能用、新 F 版禁用，属于能力下线"],["发起直播","不可","不可","—"],["会议录制 / 听记","❌","跟随免费版会议 / 时长由企业管理员自主配置","—"],["成员版本设置","无此机制","开通后 14 天内必须完成设置，超期未设置的成员默认 F 版","⚠️ 交付当天就要带管理员设置"],["新成员加入","—","默认为 F 版；管理员可在页面右上角「新成员默认」改规则；底座席位不足时默认设为 F 版","⚠️ 提醒客户配置默认版本策略"],["赠送账号数","—","不赠送 365 会员、Exchange 日历同步、邮箱账号数、Linux 端授权数（按底座购买人数发放）；但底座这些账号可分配给 F 版用户使用","例：100 个 D4 + 200 个 F，上述账号总数仍是 100"]],"note":"来源：《销售FAQ》《买【钉钉商业版本】送千问办公权益说明》与本地对比表 Sheet「新老F版对比」。"},"talk":"一线员工不建议跟管理层买同一个版本：F 版每人每年 80 块，给的是一个正式使用身份，共享您 AI 尊享版/旗舰版的全部企业资源，PC 和手机都能用。但我有三条限制要先说清：会议能发起但是 25 方 60 分钟、云文档每月新建 3 份、日程不能创建。另外开通后 14 天内我们必须和您一起把成员版本分配好，否则没分配的人默认就是 F 版。","risks":["⚠️ 14 天内必须完成 F 版成员设置（支持批量导入与选人配置），超期未设置的成员全部默认为 F 版。","⚠️ D3/D4 与 F 版组合时，底座起订量不少于 100 席位，且（D3/D4 + F）合计席位 ≥ 通讯录人数。","⚠️ 增购 APP 定制或混合云&合规时，按 D4 + F 版总坐席一起增购（例：100 D4 + 900 F → 需买 1000 席）。","⚠️ F 版可购买范围是「专属系列 D3/D4」；老 F 版升级新 F 版同样触发 14 天设置机制。","⚠️ D3 + F 版可以合并报价，需要在报价工具里到关联品类添加 F 版。","⚠️ FAQ 中「1000 人客户用 D3/D4 + F 组合可能比全买 D1/D2 更便宜」是官方确认存在的情况——算价时两种方案都要给客户算。"],"srcNote":"来源：SRC-INT-KB《【钉钉商业版本】销售FAQ》《【钉钉商业版本】销售话术参考》+ 本地对比表 Sheet「新老F版对比」。"},"obj":{"title":"客户追问与异议处理","intro":"按「客户会怎么问 → 官方答案 → 注意点」整理。答案均来自内部《销售FAQ》与对比表，可直接照着说。","qa":[{"q":"会议额度用完了会怎样？是降清晰度还是不能开？","a":"不能开了（不是降清晰度）。所以选档要按年总量估，不要按「差不多」报。"},{"q":"会议分钟是怎么算的？","a":"按设备数计算，每个设备入会的分钟数累加。例：一场会 10 人参加、2 人用双设备入会，消耗 =（8 + 2×2）× 参会分钟数。多人多端会明显加速消耗。"},{"q":"100 万分钟里包含 AI 听记转写吗？","a":"不包含，也不单独打包。AI 听记消耗 AI 算力/千问积分，与视频会议时长包独立结算；钉钉商业版本不包含 AI 听记权益，需要单独购买。"},{"q":"有直播需求，版本里带吗？","a":"新底座不包含额外直播权益，与标准版一致：每组织默认 3,000 分钟/年标清直播（1 个 300 方标清直播间）。需要更多时长要单独购买「直播时长包」。"},{"q":"买了 D1，连接流 700 次/月，和免费标准版的 500 次叠加吗？","a":"不叠加。标准版免费额度 10.21 后调整为 700 次/月，D1 也是 700 次/月。连接流需求更高就得 D2 及以上。"},{"q":"坐席是不是就等于企业账号？","a":"是。每个坐席可绑钉钉账号也可绑企业账号，不做区分；买 N 席即可加 N 个企业账号，原有企业账号能力不受影响。"},{"q":"容量是按人算还是按组织算？","a":"都按组织算，不存在个人分摊。"},{"q":"AI 表格那 2 万行写着「限时」，是不是很快就没了？","a":"官方口径：标准版免费提供限时 2 万行 AI 表格体验额度，如无更多调整客户可持续使用；具体截止时间以官方 SOW/知识库为准。D2 起为 2 万行（非限时），D3/D4 为 5 万行。"},{"q":"D3 和 D4 的核心差异到底是什么？","a":"D4 含访问&数据安全完整能力（数据密级标签、DLP、访问控制中心、三色管控、暗水印、防录防截等），并有更高额度且随购买人数扩容的企业用量；仅 D4 可增购 APP 定制、混合云&合规、移动端设备管理 MDM。"},{"q":"价格里含服务吗？","a":"产品定价包含基础的客满服务，不包含交付服务和 CSM 服务，如客户有需求需单独增购。"},{"q":"跟飞书比，你们一句话优势是什么？","a":"官方口径：打造 AI 组织，最优性价比的选择。展开时按版本对（话术参考给出对标：飞书企业标准版 1320 / 旗舰版 2640 / 一线专业版 360），引用竞品价格前先用《竞品对比（vs飞书）》核实。"},{"q":"我们组织超过 1000 人，能不能买 D1/D2 省钱？","a":"不能。1000 人以上只可购买 D3/D4。想控成本可以用 D3/D4 + F 版组合，把一线员工放到 F 版。"},{"q":"能不能只给部分人买商业版，其他人用免费版？","a":"不支持。一个组织只能一个版本，也不支持部分成员商业版席位、部分成员标准版的混合模式。"},{"q":"我们还在专业版合同期，能直接升新底座吗？","a":"不能直接买（通讯录权益冲突），需要先退老订单再购新底座；直接升级方案在推进中。这个规则一定提前讲，避免客户白走流程。"},{"q":"会不会突然就加不了人、开不了会（大面积撞墙）？","a":"不会一次性撞墙，钉钉采用逐步放量方式；过程中可通过问题反馈渠道及时上报。"},{"q":"阿里云那边的 code 上架了吗？","a":"官方 FAQ 口径：阿里云 code 在 10 月底上线，两边技术在对接中。涉及阿里云渠道走单的客户，下单前先确认时点。"}],"srcNote":"来源：SRC-INT-KB《【钉钉商业版本】销售FAQ》《【钉钉商业版本】销售话术参考》。"},"conflict":{"title":"口径冲突清单（说之前先看这页）","intro":"我把本地对比表、内部知识库、官方公开报道逐条对齐后，发现以下几处不一致。原则：量化承诺以最新 SOW 与报价工具为准；对客户表达时选更保守的那个口径，并把冲突点带回去反馈。","table":{"title":"冲突项","head":["议题","A 口径","B 口径","面客建议"],"rows":[["会议分钟额度单位","SOW：视频会议用量（分钟/年）→ 100万 / 300万 / 1500万 / 1500万+4000×购买人数","《销售话术参考》：D2「300 万分钟/月」、D3「1500 万分钟/月」（同文 D4 又写 /年）","已定口径：按「年度额度」说；话术参考的「/月」视为笔误，可反馈修订"],["高管保护模式人数","SOW + 对比表：D1 100、D2 500、D3 5000、D4 5000","《销售话术参考》：D3「高管保护 1000 人」","已定口径：按 SOW 的 100/500/5000/5000 说"],["AI 高级版单价","《增购品功能清单-SOW》：600 元/坐席/年","《核心价值highlight》《销售FAQ》《新老版本对比》：640 元/人/年","⚠️ 未决：本工具按 640 展示；报价前必须与城市经理/报价工具确认"],["邮箱 / 365会员 / Exchange / 企业账号 / Linux 端账号数","对比表写「底座账号数 / 随购买人数」","SOW 明确：购买人数×105%（F 版：企业账号=F版购买人数，邮箱与 Linux 授权 F 版 ❌）","已定口径：按「购买人数×105%」说，并说明 F 版不赠送这些账号数"],["APP 定制 / 混合云合规单价","FAQ 版本表：APP 定制 120 元/人/年、混合云合规 100 元/人/年","FAQ F 版举例：APP 定制 100 元/人/年、混合云合规 120 元/人/年","两值互换了，属原文自相矛盾；一律以报价工具/SOW 为准，不口播单价"],["企业邮箱账号数","对比表：D1-D4 均为「底座账号数」","FAQ：365 会员、Exchange、邮箱账号数、Linux 端授权数按底座购买人数发放，F 版不赠送","统一口径为「= 底座购买人数」，并说明可分配给 F 版成员使用
