咨询城市经理（FAQ 原文）。"]},"rulesBrief":{"body":"一企一版本 · 下单人数 ≥ 通讯录实际人数 · 通讯录上限 105% · D1 不限起订，D2-D4 起订 20 席，叠 F 版时底座起订 100 席 · 合约期不可降级、减席需退款重下 · 首次买 1 年后续只能 1 年，买 3 年锁 3 年 · 在约专业版/专属版客户不能直接买新底座（需先退再买）· D4 单独新购/续费不自动开通，必须走交付平台 + 购买交付服务。详见「售卖与交易规则」。"},"priceExtra":{"cards":[{"h":"增购品与单独收费项（价格冲突项见冲突清单）","lines":["APP 定制：需绑定 D4 购买。FAQ 版本表写 120 元/人/年，同文 F 版举例写 100 元/人/年 → 冲突，以报价工具为准。","混合云&合规：需绑定 D4 购买，F 版也需购买。FAQ 版本表写 100 元/人/年，举例写 120 元/人/年 → 冲突。","MDM（移动端设备管理）：需同时购买 D4 和 APP 定制（FAQ：MDM 需同时购买 D4 和 APP 定制），仅 D4 可增购。","交付服务：DT_GOODS_DINGTALKService，D4 必买（与席位数无关）；原专属钉且已购「访问&数据安全」的客户免。","用量增购：会议时长包、钉盘扩容包、直播时长包、AI 表格行数、DING、连接流增购包等各有独立 SKU、独立扣款，需在已购底座基础上增购。","千问办公：VPC 版本席位与积分包通过阿里云渠道订购；赠送的 SaaS 席位不能折价换 VPC，赠送积分可充值到 VPC 席位。"]},{"h":"报价工具用法（原文）","lines":["1、输入企业购买人数；2、输入购买年限；3、勾选购买产品；4、输入产品折扣。","D3 + F 版可合并报价：需要在报价工具里到「关联品类」添加 F 版。","折扣规则：商签与直签是否一致 → FAQ 原文「折扣与报价策略请咨询城市经理」。","阿里云 code：10 月底上线，对接中；走阿里云渠道前先确认时点。"]},{"h":"返佣（内部）","lines":["生效：2026.10.1（表内「调整生效时间」列）；红线折扣率列注释：（红线返佣0，仅计业绩）。","钉钉商业底座 d1/d2 红线 0.6、满返 1；d3 红线 0.5、满返 0.8；d4 红线 0.4、满返 0.7。","自建新签 45% / 分发新签 35% / 续签 25%（d1-d4 同值）。","⚠️ 图片顶部标题与政策版本号被裁切，未识别到政策名称与适用范围；分类 II/III/IV 为老底座增购品与其他单品（如专属钉钉底座 FY24 版红线 0.3、满返 0.65），须以官方政策原文核对后使用。"]}]},"discipline":["只说来源里有的数：任何量化承诺（人数、分钟、容量、次数、设备数、单价）必须能指到对比表的某一格、或知识库原文的某一句；写「随购买人数/随购买账号」的就照实说按人头配置。","限时体验 ≠ 长期能力：对比表标注「限时体验」的权益（审批数据管理/批量处理/审批自动化在 D2、D3；AI 表格单表行数在 D1 与新标准版；智能字幕在新标准版）不得写入合同或承诺长期可用。","试用阶段不发放的权益不要演示：D4 售前试用不发通讯录人数、365 会员、短信电话 DING、视频会议用量、电话拨入、直播用量、钉盘、同时参会人数、直播观看人数、AI 算粒、千问积分。","独立商品名 ≠ 版本权益：老专属版列里写「访问&数据安全」「开放&集成」「APP定制」「Linux端授权」的项，代表过去按商品采购，迁移到商业版时按档位与增购条件重新核对。","先讲清是升级还是降级：新标准版相对老标准版多处收紧（单场会议 25 人、通讯录认证后 1000 人、群文件临存 30 天），免费客户不要拿「新版」当卖点；从专业版升 D1/D2 时注意会议人数与打印点数会变小。","生效与合同口径统一：2026-10-21 起逐步生效、升降权分批次生效，原合同期内客户继续享有原有权益；任何「哪天生效」的回答都要加「以合同期与后台实际开通为准」。","行业与地域例外要主动确认：教育、政府、医疗的通讯录/上下级/音视频暂不受影响；海外 DingTalk 客户端客户本次不涉及，且海外组织不可购买新底座。","冲突优先保守：见「口径冲突清单」，两个口径不一致时按更保守（更小/更严）的那个说，并把冲突带回给产品经理或城市经理确认。","持证下单：10.21 起下单新底座必须持有「钉钉商业版本销售初级认证」；D4 另需交付高级认证要求，接单前先确认自己的授权范围。"]}},"mirror":{"faqs":[{"sec":"一、版本与定价","q":"新底座有哪些版本？分别多少钱？","a":"新底座包含4个付费版本 + 1个标准版 + 1个F版，具体如下：\n版本\n| 价格\n| 适用对象\n| 标准版\n| 免费\n| 个人和微型团队\n| AI基础版(D1)\n| ¥400/人/年\n| 小型团队\n| AI高级版(D2)\n| ¥640/人/年\n| 成长型企业\n| AI尊享版(D3)\n| ¥960/人/年\n| 中大型组织\n| AI旗舰版(D4)\n| ¥1760/人/年\n| 大型企业\n| F版（需绑定D3或D4购买）\n| ¥80/人/年\n| 一线员工\n| APP定制（需绑定D4购买）\n| ¥120/人/年\n|\n| 混合云合规（需绑定D4购买，F版也需购买）\n| ¥100/人/年\n|\n|"},{"sec":"一、版本与定价","q":"标准版有什么变化？","a":"标准版进行了权益调整，核心资源用量撞墙后需购买底座。具体变化如下：\n权益项\n| 调整前\n| 调整后\n| 变化方向\n| 通讯录（认证后）\n| 最高10万人\n| 1000人\n| 下调\n| 视频会议单场人数\n| 100人\n| 25人\n| 下调\n| 视频会议总时长\n| 不限\n| 100万分钟/年\n| --\n| 直播总时长\n| 不限\n| 3000分钟/年\n| --\n| 付费API接口调用量\n| 5000次/月\n| 10000次/月\n| 上调\n| Webhook & Stream\n| 3000次/月\n| 不限制\n| 上调\n| 连接流\n| 500次/月\n| 700次/月\n| 上调\n|"},{"sec":"一、版本与定价","q":"千问办公积分是怎么回事？","a":"购买任意商业版本均赠送千问办公企业座席（价值980元/人年），全员可用。积分按版本不同如下：\n版本\n| 赠送席位\n| 积分数量\n| 价值\n| D1\n| 千问办公saas版\n| 4000积分 x 购买人数\n| 200元/人\n| D2\n|\n| 6000积分 x 购买人数\n| 300元/人\n| D3\n|\n| 8000积分 x 购买人数\n| 400元/人\n| D4\n|\n| 12000积分 x 购买人数\n| 600元/人\n| F版\n|\n| 800积分 x F版购买人数\n| 40元/人\n| 注意事项：\n千问限时活动，即日起 至 2026年12月31日\n席位为 SaaS 版，不含 VPC 与私有化版本\n积分赠送范围限 2026.12.31（含）前的新购、升级、增购订单\n积分增购，需通过阿里云渠道下单\n积分将于「钉钉商业版本」正式开通后下发，积分自从下发日起，3个自然月内有效，过期不结转"},{"sec":"一、版本与定价","q":"现在产品的定价包含服务吗？","a":"目前的产品定价包含基础的客满服务（见下），不包含交付服务和CSM服务，如客户有需求需要单独增购。"},{"sec":"一、版本与定价","q":"D3和D4的核心差异是什么？","a":"D4含访问&数据安全完整能力，更高额度的企业用量，且随购买人数扩容。\n仅D4可增购app定制、混合云&合规、移动端设备管理MDM"},{"sec":"一、版本与定价","q":"1000人客户用D3/D4加F版组合是否反而比全买D1/D2更便宜？","a":"会出现这种情况。F版账号使用功能有限，包括不可发起日程/直播，月度仅可新建3篇文档、发起会议限25人/60分钟等，详见SOW。"},{"sec":"一、版本与定价","q":"升级后，我们对比飞书一句话优势是什么？","a":"打造AI组织，最优性价比的选择"},{"sec":"一、版本与定价","q":"现在的F版与原F版相比产品定位和能力边界有什么变化？","a":"见培训材料"},{"sec":"一、版本与定价","q":"阿里云 code 什么时候上架？","a":"阿里云 code 在 10 月底上线，现在两边技术在对接中。"},{"sec":"一、版本与定价","q":"会议用量耗尽是降低清晰度还是不能开了？","a":"不能开了。"},{"sec":"一、版本与定价","q":"一场会议10人参加、2人双设备入会，消耗时间如何计算？","a":"按设备数计算，每个设备入会的分钟数累加。（8+2*2设备）*参会分钟数。"},{"sec":"一、版本与定价","q":"视频会议100万分钟怎么计算？分钟数是否按参加人数计算消耗？@王天铎(弘阳)","a":"按设备数计算，每个设备入会的分钟数累加，详见文档"},{"sec":"一、版本与定价","q":"100 万分钟视频会议是否包含 AI 听记转写？AI 听记权益在底座里吗？","a":"不包含、也不单独打包。AI 听记消耗的是 AI 算力/千问积分用量，与视频会议时长包独立结算。"},{"sec":"一、版本与定价","q":"买 D1 后连接流 700 次/月，与标准版 500 次是否叠加？","a":"不叠加。标准版免费额度 10.21 后调整为 700 次/月，D1 也是 700 次/月；若客户连接流需求更高，建议引导 D2 及以上。"},{"sec":"一、版本与定价","q":"价格是否区分白领/蓝领？","a":"蓝领/一线员工建议购买按F 版（80 元/人/年），须绑定 D3 或 D4 购买。"},{"sec":"一、版本与定价","q":"新版本每个坐席是否等同于一个企业账号？按购买人数发放吗？","a":"是。每个坐席既可绑定钉钉账号也可绑定企业账号，不做区分；买 N 席即可加 N 个企业账号，原有企业账号能力不受影响。"},{"sec":"一、版本与定价","q":"新版本容量按组织算还是个人算？","a":"都按组织算，不存在个人分摊。"},{"sec":"一、版本与定价","q":"新商业版标准版里「AI 表格 2 万行限时使用」是什么意思？限时多久？","a":"标准版免费提供限时 2 万行 AI 表格体验额度，如无更多调整，客户可持续使用；具体截止时间以官方 SOW / 知识库材料为准。\n@王天铎(弘阳)@吕莹(习礼)"},{"sec":"二、交易规则","q":"可以同时购买两个版本吗？","a":"不可以。一个组织只能选择一个版本。一个组织，D1-D4只能购买一个版本，老专业版、专属版与新底座也只能同时购买一个。\n（不支持部分成员分配商业版席位、部分成员标准版（免费）的混合模式。）"},{"sec":"二、交易规则","q":"1000人以上的客户有哪些购买方式？","a":"1000人以上只可购买D3/D4 版本，不可购买D1\\D2版本。结合客户的情况，可以选择D3/D4 搭配F版购买。"},{"sec":"二、交易规则","q":"1个坐席也可以买吗？","a":"1个坐席只能购买AI基础版，如果需要购买D2，D3，D4版本，则20个席位起卖。\nAI基础版（D1）不限制起订量；\nAI高级版（D2），AI尊享版（D3），AI旗舰版（D4），起订量 为 20席位数；\nAI尊享版（D3）和 AI旗舰版（D4）如果需要叠加购买F版，则底座账号（D3、D4起订量不少于 100席位）\n下单时会校验组织通讯录当前人数，不可少于当前人数。示例：如组织通讯录100人，必须购买≥ 100人，低于100人无法下单。"},{"sec":"二、交易规则","q":"一个500人企业，可以只买200个坐席吗？购买人数有什么要求？","a":"不可以，企业购买人数必须大于等于通讯录实际人数，少于通讯录人数无法下单。\n购买「商业版本」后，组织通讯录上限给予105%的buffer（例如购买100席，通讯录上限可达105人）。"},{"sec":"二、交易规则","q":"可以降级吗？","a":"合约期内不允许降级。4个版本只可以从低到高升级，如需降级需要退款。"},{"sec":"二、交易规则","q":"买了200个坐席，需要减少坐席到100个，可以吗？","a":"不可以，需要直接退款后重新拍。"},{"sec":"二、交易规则","q":"购买年限有什么规则？","a":"首次下单时，若买1年，后续增购、升级都只可1年时长；若买3年，后续都需只可3年时长。续签时可以换规格和年限重新选配。当前可购年限支持 1-3年。"},{"sec":"二、交易规则","q":"在约的专业版/专属版客户能买新底座吗？","a":"不能直接购买。因为在约专业版/专属版组织与新底座通讯录权益冲突，需先退款再购买新底座。\n*在约老底座（专业/专属）升级新底座产品方案推进中（请留意后续通知）"},{"sec":"二、交易规则","q":"原本购买50人版本，后续有员工进来只需要补差价嘛？系统会怎么样？","a":"继续增购人数就行，系统会根据剩余时长计算价格。"},{"sec":"二、交易规则","q":"客户买的D2功能不够用，直接升级D3可以补差价吗？","a":"可以，下单的时候系统会自动计算价格。"},{"sec":"二、交易规则","q":"增购/升级怎么算差价？","a":"系统根据单价及剩余时长自动算差价，公式如下：\n中途加人（版本不变）：单价 x 新增人数 x 剩余月数 / 12\n中途升版本：(新版价 - 旧版价) x 原人数 x 剩余月数 / 12 + 新版价 x 新增人数 x 剩余月数 / 12\n举例1 -- 中途加人：1月1日购买100人D1，3月1日加50人：费用 = 400 x 50 x 10 / 12 = ¥16,667\n举例2 -- 升版本+加人：6月1日从D1(150人)升D2，同时增购30人：费用 = (640-400) x 150 x 5 / 12 + 640 x 30 x 5 / 12 = ¥15,000 + ¥8,000 = ¥23,000"},{"sec":"二、交易规则","q":"D4下单后为什么没有自动开通？","a":"AI旗舰版（D4）需要走交付平台单独开通，付款后不会自动开通。但如果是从D1/D2/D3升级到D4，则会直接开通，建议在下单前销售同学谨慎校验。《【钉钉商业版本】AI旗舰版（D4）开通说明（含POC）》"},{"sec":"二、交易规则","q":"D1、D2、D3有POC流程吗？","a":"没有。D1、D2、D3没有POC流程，下单后自动开通。"},{"sec":"二、交易规则","q":"客户 500 人，先清理到 100 人买 100 席，再把清出去的 400 人拉回来可以吗？","a":"不可以。买100 席后通讯录上限锁 105 人（5% buffer），超出无法加人，系统会提示增购。"},{"sec":"二、交易规则","q":"客户是标准版 2000 人组织，1021 后规则生效是否会自动缩减到 1000 人？","a":"不会主动清人，但客户无法再新增员工，提示增购以后才能继续加人。"},{"sec":"二、交易规则","q":"组织上下级关联（主组织 + 被关联组织）人数如何计算？下级人数会占用主组织通讯录吗？","a":"完成年检认证的上级组织，按商业版本自动获赠「上级可邀请关联的总额度」，下级需购买商业版本（购买版本无需与上级一致），才具备关联上级、同步数据的能力，下级组织人数不计入上级；"},{"sec":"二、交易规则","q":"客户组织 1000 人、做过年检认证（原上限 10 万），27 年 3 月续费专业版再认证后，人数上限是新政策 1000 人还是保留 10 万？","a":"客户27年3月续签以后，专业版服务在28年3月到期，在专业版到期之前享受当前专业版的权益不变，如当前上限是10 万则继续享受10万，但到期后如未升级新底座，则受新规则限制。\n@王天铎(弘阳)\n专业版专属版新签：10月21日起，钉钉专业版、钉钉专属版停止新签，对新客户端只允许传递新服务新价格，仅支持售卖钉钉新商业版本（新底座）。\n专业版专属版续签：在2026年10月21日-2027年9月30日期间进入专业版续签期、专属版续签期的客户，可续费老品1次最长1年。\n单品新签：在2026年10月21日前，当前在售单品可正常下单新签、可续约、可增购。遵循当前交易规则。\n单品续签：在2026年10月21日后，单品付费期内客户权益不受影响，可正常享受当前服务权益至合同履约结束。2026年10月21日后，融入底座单品（见表格清单）停售，需要购买钉钉商业版本后可直接使用；底座增购单品（见表格清单）需要先购买钉钉商业版本才可购买。（单品范围：Office套件、AI表格、PaaS（连接流增购包）、智能人事高级版、假勤（一方部分）、智能OA、上下级、云打印、日历Exchange同步等；钉盘、会议（时长、方数）、AI表格行数、DING等。）"},{"sec":"三、老品售卖规则","q":"在10月21日前已经对客报价老专业版/专属版，但是客户来不及付款怎么办？","a":"在10月21日之前，客户有采购意向、报价、参与招投标的项目，可根据对客的书面记录申请报备、AI听记，在11月30日之前完成付款或合同签约可订购老版。预计10月8日会给大家ding公告推停售品开白下单的审批链接，节后在合作伙伴-工作台- OA审批里也可以搜到。"},{"sec":"三、老品售卖规则","q":"之前合同年框签约3年，客户可以按照老专属版的价格继续续约吗？","a":"请在10月21日之前进行报备，提供与客户签订的合同进行报备，报备后可按照合同约定续约（专属版在2027年9月30日后退市，续约需在该时间点前完成）。"},{"sec":"三、老品售卖规则","q":"专属版的在约客户，买了1年AI表格，接下来要增购怎么办？","a":"在2027年9月30日之前，老底座在约客户如需购买单品，如客户诉求强烈、有舆情或流失风险，可提供书面证明、客户沟通记录进行特殊报备，报备后单品可续约。"},{"sec":"三、老品售卖规则","q":"老的专业版/专属版还能买吗？","a":"2026年10月21日起停止新签。在此之前可以正常购买。详情请见公告：《钉钉商品体系调整及部分老商品Code停售公告》。如客户采购流程尚未走完，10月8日起可通过OA审批-工作台-停售商品下单开白申请，发起审批。"},{"sec":"三、老品售卖规则","q":"老专属钉的续费/续约/续签最早可以提前多少天？也是像专业版一样，最多提前 120天吗?","a":"老专属钉的续费/续约/续签不限制提前时间，提前多久都可以续费。与专业版不一样，专业版是最多提前120天。"},{"sec":"三、老品售卖规则","q":"老客户还能续费和增购吗？","a":"C类商品（原底座及部分用量单品）：允许在2027年9月30日前续签和增购，但不可新签。\nD类商品（被底座合并的单品）：按退市过渡处理。请至钉钉文档查看附件《公告版-【钉钉】老商品Code梳理-仅钉钉内部版》。"},{"sec":"三、老品售卖规则","q":"老客户怎么迁移到新底座？","a":"需要退掉老订单，再购买新底座。直接升级方案开发中。"},{"sec":"三、老品售卖规则","q":"新底座上线后AI表格免费版还有吗？","a":"能用；底座里含原AI表格单品高级功能，免费版还能用。"},{"sec":"三、老品售卖规则","q":"已成单的专业版客户是否必须升级新底座？","a":"不必须。老专业版付费客户合约期内权益不受影响；在2027年9月30日前，进入续签期的客户可再续 1 次专业版；到期后需要引导升级新底座。"},{"sec":"三、老品售卖规则","q":"没买底座但买过智能 OA 单品 / Office / AI 表格的客户，1021 后还能续签吗？","a":"不能。被底座融合的单品 1021 起停止续签，建议提前引导到新底座或 1021 前完成续费。\n@谢海真(花黎)"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"D4支持售前试用（即D4版本 POC）吗？","a":"支持。仅D4和F版支持售前试用（即即D4版本 POC）。\n开通流程说明：《【钉钉商业版本】AI旗舰版（D4）开通说明（含POC）》\n注意事项：\n混合云合规、APP定制不支持售前试用。\n售前试用期间以下权益不发放：通讯录人数、365会员、短信电话DING、视频会议用量、电话拨入、直播用量、钉盘、同时参会人数、直播观看人数、AI算粒、千问积分。\n申请AI旗舰版（D4）POC流程如下：\n第一步\n| 销售同学 提交试用开白名单：AI旗舰版D4试用开白（POC权限申请）\n对接人：@罗子仪(露帕)\n| 第二步\n| 开通 交付平台 白名单\n对接人： @林朋(解识)\n开通成功后，【交付平台-项目-开通】后台会出现：功能模块下的【钉钉旗舰版】\n如未出现，请刷新浏览器，清除缓存\n| 第三步\n| 开通 新底座OA后台 白名单\n对接人：@周颖婷(栗鸢)\n| 第四步\n| 销售同学 在 交付平台完成 POC申请：https://tesla.dingtalk.com/project\n|"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"已购D1/D2/D3升级到D4后需要交付怎么办？","a":"D1/D2/D3升级到D4目前为直接开通，无法走线下交付链路。如需交付，需要先退再买。"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"老专属(FY24版)能升级到新底座D4吗？","a":"老专属和新底座是两个不同商品，系统内不存在升级关系。需要老订单退款，再购买新底座。"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"走线上订单开通后，还能走线下延期吗？","a":"不能。走线上就完全按订单来，无法走线下流程。要么全部线上，要么全部线下，不能混合使用。"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"售前试用结束后如果不买，功能怎么回收？","a":"试用结束后权益中心自动回收，功能不可用、不可进入。"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"提前交付期间权益用量用完了怎么办？","a":"提前交付期间按购买订单的完整数量发放权益，用完后不影响正式开通后的权益。进入正式交付/正式开通阶段后，会关闭提前交付的所有权益，按订单重新发放一轮新的权益。"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"降配（D4降到D3等）怎么处理？","a":"系统不支持直接降配。需要退款重下：先退掉当前版本，再购买目标版本。"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"旗舰版的需交付开通？交付额外收费么？","a":"旗舰版需交付开通，交付需要额外购买交付服务，交付服务可咨询@孙潇页(笑曳)。\n下单钉钉底座交付服务，DT_GOODS_DINGTALKService"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"D3的专属安全和D4的访问&数据安全的核心区别是什么？@王天铎(弘阳)","a":"参考专属版或者直接看sow"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"买了D4后，APP打包还要单独按人数购买？怎么收费？若与账号单独分开收费，为什么还要按账号数收？@王天铎(弘阳)","a":"需要单独按人数买，新底座卖的是产品能力，不是一次性服务。详情可以查看知识库里的code list和报价工具。"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"买D4一定要买交付服务吗？不管几个席位都要买吗？","a":"是的。"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"这个交付服务是原价交付还是生态交付？服务商签单也要买原厂的交付服务吗？","a":"目前下单的是原厂交付，后续可开放给有交付资质的服务商的交付（需经过学考授权）。"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"原来专属钉的客户升级到D4，也要再买一次交付服务吗？有没有什么老客升级的政策？","a":"原专属钉客户且购买开通了“访问&数据安全”产品的客户，无需购买D4交付服务。后续D4客户续费或增购也无需再购买交付服务。"},{"sec":"四、AI旗舰版（D4）与交付服务","q":"交付服务都包含哪些内容？和原来专属的交付服务一样吗？","a":"主要内容是原“专属钉底座”交付服务和原“访问&数据安全”交付服务，但是SOW内容有所增加更新。详见服务SOW。\n@王天铎(弘阳)"},{"sec":"五、F版相关","q":"什么是F版？F版和底座版本有什么区别？","a":"F版是面向一线员工的精简版本，类似飞书的蓝领版，共享企业资源，支持PC/移动端，但限制部分功能：\n功能\n| F版限制\n| 发起会议\n| 可发起，单场60分钟/25人\n| 参加会议\n| 可以\n| 云文档\n| 每月最多新建3份（含AI表格）\n| 发起直播\n| 不可\n| 创建日程\n| 不可\n|"},{"sec":"五、F版相关","q":"现在的F版和飞书的蓝领版有什么区别？","a":"一句话总结：秒杀竞对，从一线员工考勤审批，升级到参与组织的AI协同，共享组织资源用量\n竞对一线标准版（￥180/人年）\n仅移动端\n| 竞对一线专业版（￥360/人年）\n支持PC\n|"},{"sec":"五、F版相关","q":"现在的F版和和老的F版有什么区别？","a":"功能模块\n| 功能名称\n| 老F版\n| 新F版\n| 基础信息\n| 定价\n| 39元/人年\n| 80元/人年\n| 新F版更优\n| 登录限制\n| 仅移动\n| 移动+PC\n|\n| 会议\n| 不可发起\n| 可发起（限25方60分钟）\n|\n| 会议录制\n| ❌\n| ✅\n|\n| 听记\n| ❌\n| ✅\n| 低于老F版\n| 创建日程\n| ✅\n| ❌\n|\n| 新建云文档（含AI表格）\n| ✅\n| 每月3次（本地文件转为在线文档也计入额度）\n|"},{"sec":"五、F版相关","q":"F版可以单独购买吗？","a":"不可以。F版不可独立购买，需绑定AI尊享版(D3)或AI旗舰版(D4)购买。"},{"sec":"五、F版相关","q":"D3/D4 与 F 版组合销售，是否有起购数量或比例限制？","a":"D3/D4 均 20席起卖，如果需要和F版组合销售，则底座账号（D3&D4）起订量不少于 100席位。但（D3/D4 + F）合计席位数须 ≥ 通讯录人数。"},{"sec":"五、F版相关","q":"100 人的公司，可以买 1 个 D3 + 99 个 F 版进行下单吗？","a":"不可以。如果D3/D4 需要与 F 版搭配销售，则底座账号（D3/D4起订量不少于 100席位）；且（D3/D4 + F）合计席位数需 ≥ 组织通讯录人数。"},{"sec":"五、F版相关","q":"F版能单独售前试用吗？","a":"不能单独试用，具体规则如下：\n如已购买D3（D3为自动开通）：F版不能开售前试用，只支持正式开通。\n如计划购买D4：在勾选底座售前试用的前提下，可选择F版售前试用。\nF版售前试用结束时间与底座保持一致。"},{"sec":"五、F版相关","q":"F版成员怎么设置？","a":"组织首首次购买开通F版、或老F版升级到新F版后，需要在新F版开通后14天内完成F版成员的设置（支持批量导入和选人配置）。超期未完成版本设置的成员，将全部默认为F版。"},{"sec":"五、F版相关","q":"购买了F版的组织后续新成员加入时默认为什么版本？","a":"新成员加入组织时，默认为F版\n管理员可在页面右上角点击「新成员默认」，进入规则设置页面，根据组织需要设置新成员加入组织时的默认版本\n当底座版本席位不足时，将默认设置为F版"},{"sec":"五、F版相关","q":"F版能和D4版统一打包APP吗？@王天铎(弘阳)","a":"可以"},{"sec":"五、F版相关","q":"客户买了D4后，增购 APP定制 或 混合云&合规时，F版的坐席也需全员增购吗？","a":"是的。APP定制、混合云&合规 是按D4+F版的总坐席一起增购的。\n如客户购买D4版100席、F版900席，如需增购 APP定制 或 混合云&合规，则要购买1000席APP定制（100元/人/年） 或 1000席混合云&合规（120元/人/年）。需注意：AI尊享版（D3）和 AI旗舰版 （D4）如果需要叠加购买F版，则底座账号（D3&D4）起订量不少于 100席位。"},{"sec":"五、F版相关","q":"D3+F版方案是否可合并报价?","a":"可以，需要到关联品类添加F版\nQ、购买F版账号会赠送365会员账号数、Exchange日历双向同步账号数、邮箱账号数、Linux端授权数吗？\n不会。365会员账号数、Exchange日历双向同步账号数、邮箱账号数、Linux端授权数按照底座购买人数发放，购买F版不赠送。举例：购买100个D4账号，200个F版账号，则365会员账号数、Exchange日历双向同步账号数、邮箱账号数、Linux端授权数为D4购买账号数的100个。\n特殊说明：D4下的365会员账号、Exchange日历双向同步账号、邮箱账号、Linux端授权数账号可以分配给F版的用户使用。即这100个D4账号，可以分配给F版的用户使用，总量只有100个账号。"},{"sec":"六、增购品相关","q":"增购品有什么购买条件？","a":"被底座融合的单品增购，需先购买「钉钉商业版本」底座。\nF版需购买专属系列（D3或D4）。\nAPP定制需购买D4。\nMDM需同时购买D4和APP定制。\n混合云合规需购买存储介质。"},{"sec":"六、增购品相关","q":"新底座有直播权益吗？","a":"新底座（商业版本）不包含额外直播权益。\n购买钉钉商业版本后，直播权益与标准版一致：每组织默认拥有 3,000分钟/年标清直播（1个300方标清直播间）。如需更多直播时长，需单独购买「直播时长包」。"},{"sec":"六、增购品相关","q":"钉钉商业版本包含AI听记吗？","a":"钉钉商业版本不包含AI听记权益。如有需要，可单独购买。"},{"sec":"六、增购品相关","q":"专属钉钉其他模块（专属安全、APP之类）增购呢？@王天铎(弘阳)","a":"除app定制，混合云&合规，都融在底座里，具体看sow，知识库里的code list，报价工具"},{"sec":"六、增购品相关","q":"标准版用户还可以单买钉盘吗？有上限吗？","a":"不可以。大的原则：10月21日以后，标准版（免费版）用户都不可购买底座内的单品，如果需要使用，需要先购买新底座。专业版、专属版在约客户仍可正常购买。"},{"sec":"六、增购品相关","q":"新底座里的视频会议、钉盘容量不够怎么增购？","a":"直接走增购品下单，会议时长包、钉盘扩容包等各有独立 SKU、独立扣款。"},{"sec":"六、增购品相关","q":"钉钉直播 单品，1021 后还能单独购买吗？","a":"1021后依旧可单独购买，标准版包含直播权益（免费 3000 分钟/年）；"},{"sec":"六、增购品相关","q":"免费 / 标准版客户可以单独购买网盘 API 增购包吗？","a":"10.21 之前可购买；10.21 之后不再单独售卖，需先升级底座再增购。"},{"sec":"六、增购品相关","q":"老专业版 / 专属版已购的流量增购包，会合并到新底座归属人名下吗？","a":"不会合并。存量商机与订单不动，独立继续跟进。"},{"sec":"六、增购品相关","q":"100 方云会议室 Rooms 权益，10.21 后还能单独买吗？","a":"不可以。1021 后 Rooms 权益不再单独售卖，需通过底座 + 对应增购能力实现。"},{"sec":"六、增购品相关","q":"已购买 AI 表格的组织，如果撞通讯录墙，是否必须升级新底座才能继续用 AI 表格？","a":"已付费在约的单品客户，权益在合约期内不受影响、可继续使用；到期后如需继续，引导升级新底座。"},{"sec":"六、增购品相关","q":"AI 表格并入新底座后，已购客户续费如何操作？","a":"建议在续费时直接引导升级新底座（含 AI 表格高级功能）。"},{"sec":"六、增购品相关","q":"老 AI 表格多年单品客户升级 D2 及以上（含 AI 表格高阶），单品费用能退或折算吗？","a":"不做退款/折算，建议通过折扣策略引导升级（如\"原花费 1 万，新底座打折抵扣，等于省下这部分升到更高版本\"）。"},{"sec":"七、对客口径","q":"官方怎么向客户传递本次升级和变化？@吕莹(习礼)","a":"对客公告，可直接发送客户https://alidocs.dingtalk.com/i/p/WVJqzqJw73dDXYEKJqzq0bvwK9DJqGYE?dontjump=true&utm_medium=dingdoc_doc_plugin_url&utm_source=dingdoc_doc"},{"sec":"七、对客口径","q":"上墙撞墙后是否会出现大面积客诉？","a":"不会一次性撞墙，钉钉采用逐步放量方式；过程中持续关注客户反馈，服务商可通过问题反馈渠道及时上报。\n@赵瑞(玖霄)"},{"sec":"八、销售折扣","q":"折扣规则，商签和直签是一样的吗？","a":"折扣与报价策略请咨询城市经理。"},{"sec":"九、特殊客群","q":"招投标 1021 前来不及下单的客户怎么办？报备的时间节点是？","a":"走特殊报备机制。在10月21日之前，客户有采购意向、报价、参与招投标的项目，可根据对客的书面记录申请报备、AI听记，在11月30日之前完成付款或合同签约可订购老版。"},{"sec":"九、特殊客群","q":"特殊报备后最长可以支持几年签约？","a":"报备只是保留老报价售卖资格、非永久授权，仍须 11.30 前完成付款下单；签约年限按对应产品当时支持的年限执行（如专业版 1 年、专属钉最长 3 年）。"},{"sec":"九、特殊客群","q":"海外组织会受到本次调整的影响吗？","a":"使用国内客户端的海外组织\n通讯录权益，音视频权益保持不变\n其他用量及高级功能（如存储满容等），按照新的商业化规则执行，如其他用量或高级功能达到当前使用上限，可根据实际需要升级至钉钉新商业版本，以获得相应的容量或功能权益\n使用海外 DingTalk 客户端的海外组织\n本次调整不涉及，通讯录、音视频、用量及高级功能均保持原规则，无需因本次调整采取额外操作"},{"sec":"九、特殊客群","q":"海外组织可以购买新底座吗？","a":"不可以"},{"sec":"九、特殊客群","q":"教育/政府组织会受到本次调整的影响吗？","a":"通讯录、钉钉上下级及音视频权益调整暂不影响教育（含教育局、K12、高校组织）及政府组织，上述行业升级方案将在后续发布，请留意官方通知\n是否可买新底座：与普通组织规则一致，可买"},{"sec":"九、特殊客群","q":"医疗组织会受到本次调整的影响吗？","a":"本次商业化调整暂不影响医疗行业组织现有的通讯录、钉钉上下级和音视频权益。上述行业升级方案将在后续发布，请留意官方通知\n是否可买新底座：与普通组织规则一致，可买\n@谢海真(花黎)"},{"sec":"一、积分发放与使用规则","q":"买新底座赠送的千问办公积分/席位，需要在阿里云下单或绑定吗？","a":"不需要。系统会在新底座正式开通后自动发放并生效，客户在钉钉端启用即可，无需单独在阿里云下单或绑定。"},{"sec":"一、积分发放与使用规则","q":"买新底座赠送的席位，席位有效期是多久？","a":"买底座赠送的千问办公席位有效期 与 所购买的底座有效期一致，随底座开通。"},{"sec":"一、积分发放与使用规则","q":"买新底座赠送的千问办公席位与积分如何发放？","a":"A1：席位：目前需要开通后引导客户在千问办公管理后台分配坐席（临时过渡方案，后续将升级为自动分配坐席），无需销售到阿里云侧做相关绑定动作。\nA2：积分：积分一次性发放至组织，送的积分可组织内共享、积分全员可共用。每个坐席可消耗的默认积分限额，按照首次发放权益时的D1~D4版本，分别是4000/6000/8000/12000，F版跟随底座版本限额；管理员可以在企业管理后台调整成员的可用积分限额，每个账号限额下限为500积分，不能设置为0。"},{"sec":"一、积分发放与使用规则","q":"买1年底座和买3年底座赠送的积分额度一样吗？","a":"这是面向新底座席位首购的优惠活动，席位续费不再额外赠送积分；因此，买1年和买3年底座，赠送的积分额度是一样的。但客户如果扩充席位或底座版本升级，会增补发放对应的积分。"},{"sec":"一、积分发放与使用规则","q":"千问办公积分用完了怎么办？","a":"积分有效期3个自然月，用完后可按需增购千办积分包。通过阿里云销售渠道增购。《千问办公销售指引》"},{"sec":"一、积分发放与使用规则","q":"千问办公积分可以晚点开通吗？","a":"积分跟随购买的底座开通时间发放，不可以延期发放。"},{"sec":"一、积分发放与使用规则","q":"3个月积分有效时间太短了，积分有效期可以延长吗？可以特殊申请吗？","a":"不可以。"},{"sec":"二、版本与终端","q":"集成的千问办公版本是网页端、钉钉端、PC端都有吗？","a":"集成的是账号，跟端没有关系，哪个端都可以登录。"},{"sec":"二、版本与终端","q":"客户不想要赠送的千问办公标准版席位，想要VPC版本的怎么办？能不能增购？","a":"如客户明确需要VPC版本，请引导客户走当前VPC版本的售卖规则购买。买新底座赠送的积分可以单独充值到VPC版本的席位中（赠送的积分有效期是自底座版本开通后，发放日起的三个月内有效，与充值到VPC版本的时间无关）。"},{"sec":"二、版本与终端","q":"买底座赠送的是千问办公标准版席位（980元/年），可以折价换VPC版本的坐席吗？","a":"不能。"},{"sec":"二、版本与终端","q":"千问当前只允许买一个版本，赠送的千问席位与自购的千问席位版本不一致时，可以正常使用吗？","a":"两个版本可同时使用，千问管理员可在后台管理不同账号的千问席位版本。"},{"sec":"三、与钉钉算粒的关系","q":"AI钉钉商业版本除送千问办公积分之外，是否也送一定量的钉钉底座通用算粒？","a":"不额外赠送钉钉算粒。后续钉钉算粒会统一成千问积分，用于消耗千问办公、AI搜问等AI品。"},{"sec":"三、与钉钉算粒的关系","q":"新版本是不是已经打通钉钉算粒与千问办公积分了？","a":"暂未打通。后续钉钉算粒会统一成千问积分，用于消耗千问办公、AI搜问等AI品。"},{"sec":"四、增购相关","q":"千问席位与积分增购如何购买？","a":"买底座赠送的是980元的标准SaaS版，如需购买VPC版本或积分包，走阿里云渠道订购，遵循当前千问办公的销售规则。"},{"sec":"五、活动规则与特殊情况","q":"赠送活动什么时候截止？","a":"在2026年12月31日前下单且支付成功的客户，均可享受本次千问席位与积分赠送，请务必关注须下单且支付成功。"},{"sec":"五、活动规则与特殊情况","q":"阿里云侧的 MaaS 商机已被别人报备，会与钉钉侧赠送冲突吗？","a":"赠送积分不需下单，与阿里云侧商机不冲突；如客户额外增购千问积分（VPC 或积分包），需走阿里云销售渠道。"},{"sec":"五、活动规则与特殊情况","q":"买底座赠送千问席位活动前，已经付费购买千问席位的客户怎么办？可以退款吗？","a":"不支持退款，但两个版本客户都可使用，买底座赠送的积分使用完以后，还可以继续使用自己付费购买的坐席及积分，也可以单独增购积分。"},{"sec":"十一、商机与归属分配","q":"新底座商机是否只有 1 个？其他版本商机是否都合并了？","a":"钉钉商业版本商机只有 1 个（正式名称：钉钉商业版本，请勿搜索\"新底座\"）；宜搭、TB、甄选、套件等商机仍独立存在。"},{"sec":"十一、商机与归属分配","q":"什么时候可以开始创建新底座商机？","a":"9 月 21 日起（学考通过次日 & 9.21 之后）可创建\"钉钉商业版本\"商机。"},{"sec":"十一、商机与归属分配","q":"9.18–9.20 期间自建的专属钉商机，在 9.21 之后有优先分配权吗？","a":"没有。仅 9.18 直播之前自建的专属商机具备优先分配权；"},{"sec":"十一、商机与归属分配","q":"9.18–9.20 三天，钉钉会给哪些客户默认生成新底座商机？","a":"专属在约/0918前专属自建商机/专业版在约的商机归属人"},{"sec":"十一、商机与归属分配","q":"60 天保护期内客户没下单，新底座商机会流出给别人吗？","a":"不会二次分配，只会自动失效。相当于给归属人一次引导升级的机会，不影响客情。"},{"sec":"十一、商机与归属分配","q":"新底座商机会保护到老底座到期吗？老底座商机在我这儿、明年到期，新底座商机会流走吗？","a":"专业版：不延续保护，60 天窗口后自动失效；专属钉：保护到老专属订单到期日（只要未断约，商机一直在归属人名下）。"},{"sec":"十一、商机与归属分配","q":"客户在 A 服务商买专业版、在 B 服务商买 AI 表格，B 的商机会被调走给 A 吗？存量专业版商机会重新流转吗？","a":"不会动存量商机。所有存量商机跟随现有 SOP 流转规则"},{"sec":"十一、商机与归属分配","q":"老专业版商机在别人那里已成单，我还能建新底座商机吗？","a":"可以。新底座商机与老专业版商机互不排斥、独立 code"},{"sec":"十一、商机与归属分配","q":"客户购买老专业版，是否可以直接扫码生成新底座商机？","a":"可以。两个商机独立、无互斥，各自跟进。"},{"sec":"十一、商机与归属分配","q":"K3000 客户，新底座商机沿用保护规则吗？","a":"沿用。K3000 只能由归属人创建/持有\"钉钉商业版本\"商机，非归属方不能建。"},{"sec":"十一、商机与归属分配","q":"拉新组织的商机分配原则会调整吗？","a":"沿用当前拉新规则，无变化。"},{"sec":"十一、商机与归属分配","q":"专业版、专属、钉盘扩容、Office 套件、AI表格等被合并商机的自建截止日？","a":"已列入合并清单的 11 个品，10.12 停止自建；10.21 全部停止新签。"},{"sec":"十一、商机与归属分配","q":"新产品的商机和老产品（专业、专属）商机是什么关系？","a":"独立的商机，互不影响。\n@陈思翼(四宜)"},{"sec":"十二、售卖资格与学考","q":"学考需要线下参考吗？","a":"学考免费参加，线上学习即可。学考参与方式：。"},{"sec":"十二、售卖资格与学考","q":"之前考过悟空等老证书，是否还能用于新底座售卖资格？","a":"每个商品都有学考，悟空证书和新底座售卖没有关系，老证书不能直接沿用。新底座对应新学考，无论之前是否考过，都需重新参加学考。"},{"sec":"十二、售卖资格与学考","q":"9.21 试卖没有证书怎么卖？","a":"原厂销售9.21起可直接下单；生态服务商从2026年10月1日之后（且考试通过后）方可下单。"},{"sec":"十二、售卖资格与学考","q":"销售证书与动销挂钩吗？","a":"不挂钩。\n@李春华(藏北)"},{"sec":"十三、DEAP相关","q":"数字员工的产品形态，商业化这一块怎么收费？","a":"@司盈煜(乐提)\n常见问题（FAQ）\nQ1：佣金什么时候发放？答：基础佣金按单预发、T+1 到账（预发比例＝当期最低档系数，本期 0.9），战略品激励加点按单全额发放；季度定档后一次性补发系数差额。因佣金系统改造周期，10月1日当日起下单成功的订单，基础佣金兑付预计将在10月10日生效兑付（具体以系统上线时间为准）\nQ2：自建商机与分发商机，新签与续签，如何认定？答：以系统商机来源记录为准，天元订单将露出标签。如对认定结果有异议，请联系对接的渠道经理提起申诉。服务商扫码或自建商机视为自建商机（系统分发商机120天内，即使扫码或自建也依然视为系统分发），钉钉系统分发的商机视为分发商机（分发商机120天后，服务商扫码或自建的视为自建商机）\nQ3：历史遗留的专属钉钉分期付款返佣怎么处理？答：这部分历史佣金将保留继续兑付，系统中也将保留老的佣金结算对账入口。\nQ4：打了折扣的订单，佣金如何计算？答：成交折扣不深于所属品类满返折扣时，享全额基础返佣；折扣越深返佣相应递减，低于返佣下限的订单不予返佣。各品类满返折扣与返佣下限，以最新一期公告为准。\nQ5：多年期合同如何计佣？答：按年化拆分计算，适用产品开通当年政策（例：3 年 300 万订单，首年按 100 万年化计）。ACV（Annual Contract Value，年度合同价值）：把一笔订单的实付金额折算成“一年期”的口径，用于计佣的基数。该订单整体视为新签或续签，佣金会在结算时一并结算。即代销多年订单，客户全款支付，业绩计1年，佣金一次性发。\nQ6：目标系数档位如何确定？答：按服务商季度业绩定档，全国统一；季度结束次月一次性补发系数差额。Q7：政策参数会调整吗？如何获知？答：佣金整体框架有效期内长期稳定；费率、系数按季度调整，战略品激励加点按月调整，调整前均会提前发布公告通知。\nQ8：经销模式（Reseller）有佣金吗？答：具体拿货价以请至钉钉文档查看附件《FY27核心品经销拿货折扣》。为准。经销模式为固定折扣拿货，无佣金，将在近期上线各核心品经销固定拿货折扣（依据规模、产品毛利，综合确立）；Reseller模式，原则上仅限固定场景可支持：签约资质、客户指定服务商、总集成、集采等场景，且经销合同需回收备案。系统预计10月中下旬上线，上线前，会通过人工改价和审批方式支持。\nQ9：老底座客户续签有过渡安排吗？答：过渡期内产品运营给予续费一次的政策，另外老底座升级新底座等相关的商机及续签细则，将另行发布补充规则。\nQ10：之前还未结算的信控分期怎么结？\n答：历史已下单，符合当时返佣政策的，将会继续按当时的返佣政策继续结算，不受本次佣金政策影响。\n《FY27钉钉服务商佣金政策【正式发布版】》\n@吕莹(习礼)"},{"sec":"十五、其他问题","q":"购买底座后API真的不限吗？","a":"购买D1及以上版本，付费API接口调用量无上限（有系统QPS限制：60QPS）。"},{"sec":"十五、其他问题","q":"会议室并发是什么意思？","a":"新底座不限制会议室并发，即不限同时发起的会议数（D1及以上），无需开会\"抢车位\"。标准版限制3个并发。"},{"sec":"十五、其他问题","q":"通讯录105% buffer是什么意思？","a":"购买钉钉商业版本后，人数后给予5%的额外空间。例如购买100席，通讯录上限为105人，超过105人提示无法新增，需要增购。"},{"sec":"十五、其他问题","q":"有系统上限这个什么意思？","a":"系统上限指一个巨大的数字，一般而言极少有客户会撞上"},{"sec":"十五、其他问题","q":"直播单场支持多少人？","a":"新底座标准版直播权益，直播单场支持300人"},{"sec":"十五、其他问题","q":"本次新底座是否涉及海外服务商和海外版本？","a":"不涉及。海外走 DingTalk 独立版本，本次调整为国内钉钉版本。"},{"sec":"十五、其他问题","q":"新底座是否有OA审批- 应用搭建的功能？如果没有如何增购？","a":"新底座不含这个功能，且无法增购，此能力逐步下线。\n1、智能OA或钉钉专业版（原）在约客户，在合同有效期内，可继续编辑和使用应用。\n2、曾使用过应用搭建的【非在约客户】，可继续查看和导出数据，无法修改或新增"}],"tables":{"feishu":[{"sheet":"Sheet1","title":"竞品对比（vs飞书）原表","rows":[["","","","标准版","","AI基础版","AI高级版","AI尊享版","AI旗舰版","","","","","","","","",""],["","","","未认证","年检认证","","","","","","","","","","","","",""],["","","","","299","¥400/人年","¥640/人年","¥960/人年","¥1760/人年","","","","","","","","",""],["功能类别","功能说明","和飞书的对比","","","","","","","","","","","","","","",""],["组织管理","","","","","","","","","","","","","","","","",""],["通讯录","最大用户数/可购人数","持平：功能&权益拉齐","500","1000","购买人数*105%\n购买人数=\u003c1000","购买人数*105%\n购买人数=\u003c1000","购买人数*105%","购买人数*105%","","","","","","","","",""],["","动态用户组","持平：功能&权益拉齐","❌","❌","10个","10个","50个","50个","","","","","","","","",""],["","企业账号","持平：功能&权益拉齐","❌","❌","随购买人数","随购买人数","随购买人数","随购买人数","","","","","","","","",""],["","高管保护","优于飞书：人无我有","3","3","100","500","5000","5000","","","","","","","","",""],["","上级组织可邀请关联的人数额度（一个上级组织可关联多个下级组织）","持平：功能&权益拉齐","❌","500","10万","10万","10万","10万","","","","","","","","",""],["","单个下级组织可关联到上级组织的人数上限","持平：功能&权益拉齐","❌","❌","随下级组织购买的底座人数","随下级组织购买的底座人数","随下级组织购买的底座人数","随下级组织购买的底座人数","","","","","","","","",""],["","上下级组织通讯录互通","持平：功能&权益拉齐","❌","❌","✅" <script>
const D = JSON.parse(document.getElementById('DATA').textContent);
const VS = ['oldStdAuth','startup','pro','exclusive','newStdAuth','D1','D2','D3','D4'];
const VNAME = {oldStd:'老标准版',oldStdAuth:'老标准版(已认证)',startup:'钉钉创业版',pro:'钉钉专业版',exclusive:'钉钉专属版(底座)',
  newStd:'新标准版',newStdAuth:'新标准版(已认证)',D1:'AI基础版 D1',D2:'AI高级版 D2',D3:'AI尊享版 D3',D4:'AI旗舰版 D4'};
const SHORT = {oldStdAuth:'老标准版',startup:'创业版',pro:'老专业版',exclusive:'老专属版',newStdAuth:'新标准版',D1:'D1 基础',D2:'D2 高级',D3:'D3 尊享',D4:'D4 旗舰'};
const DKEYS = ['D1','D2','D3','D4'];
const DLABEL = {D1:'AI基础版（D1）',D2:'AI高级版（D2）',D3:'AI尊享版（D3）',D4:'AI旗舰版（D4）'};
const GOODS = ['访问&数据安全','开放&集成','APP定制','Linux端授权','支持选配'];
let curV = 'ALL';
function vOn(f){ return curV!=='ALL' ? !isNo(f[curV]) && !isGoods(f[curV]) : true; }
function vLabel(){ return curV==='ALL' ? '全版本视角' : DLABEL[curV]+' 视角'; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }

function empty(v){ return !v || v==='❌' || String(v).trim()==='' ; }
function isNo(v){ return empty(v) || /^\s*❌/.test(String(v)); }
function isGoods(v){ return GOODS.some(g=> String(v||'').indexOf(g)>=0 && !/✅/.test(String(v))); }
function isTrial(v){ return /限时体验|限时/.test(String(v||'')); }
function threshold(f){
  for(const k of DKEYS) if(!isNo(f[k]) && !isGoods(f[k])) return k;
  for(const k of DKEYS) if(!isNo(f[k])) return k;
  return null;
}
function pnum(v){ const m = /^([0-9][0-9,\.]*)\s*([^\s]*)$/.exec(String(v||'').trim()); return m ? {n: parseFloat(m[1].replace(/,/g,'')), u: m[2]} : null; }
function firstAtLeast(f, ref){
  for(const k of DKEYS){ const p = pnum(f[k]); if(p && p.u===ref.u && p.n>=ref.n) return k; }
  return null;
}
function relation(f){
  const th = threshold(f);
  const proHas = !isNo(f.pro);
  if(!th) return {kind:'none', txt:'D1–D4 均未列入该权益（多为独立增购品或不提供）', cls:'k3'};
  const thIdx = DKEYS.indexOf(th);
  if(proHas){
    if(isNo(f.D1)) return {kind:'down', txt:'⚠️ 老专业版已含，但 D1 未列入，需升到 '+DLABEL[th], cls:'k2'};
    if(isGoods(f.D1)||isTrial(f.D1)) return {kind:'cond', txt:'⚠️ 老专业版已含，商业版为条件/限时口径（D1：'+f.D1+'），承诺前先核实', cls:'k3'};
    const a = pnum(f.pro), b = pnum(f.D1);
    if(a && b && a.u===b.u){
      if(b.n < a.n){ const need = firstAtLeast(f, a); return {kind:'down', txt:'⚠️ 数值下降：老专业版 '+f.pro+' → D1 只有 '+f.D1+(need?'，要恢复到原水平需 '+DLABEL[need]+' 起':''), cls:'k2'}; }
      if(b.n > a.n) return {kind:'up', txt:'老专业版 '+f.pro+' → D1 起 '+f.D1+'（量级提升，'+DLABEL[th]+' 起）', cls:'k1'};
    }
    return {kind:'keep', txt:'老专业版已含，升级商业版后仍含（多数档位为量级提升）', cls:'k1'};
  }
  return {kind:'up', txt:'老专业版不含 → 商业版从 '+DLABEL[th]+' 起提供（本次升级的新增卖点）', cls:'k1'};
}
function regressed(f){
  let seen=false;
  for(const k of DKEYS){ if(!isNo(f[k])) seen=true; else if(seen) return true; }
  return false;
}
</script>
<script>
/* ---------- rendering ---------- */
const view = document.getElementById('view');
function modOf(m){ return D.features.filter(f=>f.mod===m); }
function fById(id){ return D.features.find(f=>f.id===id); }
function valCell(f,k){
  const v = f[k]||'';
  let cls='have', mark='<span class="dot" style="background:var(--ok)"></span>', extra='';
  if(isNo(v)){ cls='no'; mark='<span class="dot" style="background:#42506e"></span>'; }
  else if(isGoods(v)){ cls='flag'; mark='<span class="dot" style="background:var(--c3)"></span>'; extra='<div class="tagline">非版本权益，按独立商品处理</div>'; }
  else if(isTrial(v)){ cls='flag'; mark='<span class="dot" style="background:var(--warn)"></span>'; extra='<div class="tagline">⚠️ 限时体验，不得承诺长期可用</div>'; }
  if(k===curV) cls += ' cur';
  const body = isNo(v) ? '不含' : nl(v);
  return '<td class="'+cls+'">'+mark+body+extra+'</td>';
}
function cmpTable(f){
  let h = '<table><thead><tr><th style="width:130px">版本</th><th>该功能的权益值</th></tr></thead><tbody>';
  for(const k of VS){
    const isD = /D[1-4]/.test(k);
    h += '<tr'+(isD?' style="background:rgba(47,107,255,.06)"':'')+'><td>'+(isD?'<b>'+SHORT[k]+'</b>':SHORT[k])+'</td>'+valCell(f,k)+'</tr>';
  }
  return h+'</tbody></table>';
}
function renderFeature(id){
  const f = fById(id); if(!f) return renderHome();
  const rel = relation(f), th = threshold(f), cu = D.content.features[id]||{};
  const mod = D.content.modules[f.mod]||{};
  let h = '<div class="crumb"><b>'+f.mod+'</b> · 对比表第 '+f.row+' 行 · '+vLabel()+'</div>';
  h += '<h1>'+esc(f.name)+'</h1>';
  if(curV!=='ALL'){
    if(vOn(f)) h += '<div class="chips" style="margin-bottom:8px"><span class="chip k1">'+DLABEL[curV]+' 包含此权益：'+esc(String(f[curV]).split('\n')[0].slice(0,40))+'</span></div>';
    else h += '<div class="chips" style="margin-bottom:8px"><span class="chip k2">当前 '+DLABEL[curV]+' 视角：该版本'+(th?('不含此权益（最低 '+DLABEL[th]+' 起）'):'未列入此权益')+'</span></div>';
  }
  h += '<div class="chips"><span class="chip '+rel.cls+'">'+rel.txt+'</span>';
  if(th) h += '<span class="chip">最低门槛 '+DLABEL[th]+'</span>';
  if(regressed(f)) h += '<span class="chip k3">各档位权益非单调，逐列核对</span>';
  if(cu.hot) h += '<span class="chip k1">面客高频</span>';
  h += '</div>';
  h += '<div class="card"><h3>这个功能是做什么的</h3><div style="font-size:14px;line-height:1.8">'+nl(f.desc||mod.what||'')+'</div></div>';
  h += '<div class="card"><h3>逐版本权益对比（含与老专业版对比）</h3>'+cmpTable(f)+

  if(p.warn) h += '<div class="note" style="margin-bottom:14px">'+nl(p.warn)+'</div>';
  if(p.cards) h += '<div class="grid g2" style="margin-bottom:14px">'+p.cards.map(c=>'<div class="card"><h3>'+esc(c.h)+'</h3><ul class="list">'+c.lines.map(l=>'<li>'+nl(l)+'</li>').join('')+'</ul></div>').join('')+'</div>';
  if(p.table) h += '<div class="card"><h3>'+esc(p.table.title||'')+'</h3><table><thead><tr>'+p.table.head.map((x,i)=>'<th'+(i===0?' style="width:200px"':'')+'>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
      p.table.rows.map(r=>'<tr>'+r.map((c,i)=>{
        const cls = i===0 ? '' : ((p.table.mark && p.table.mark(c,i)) ? ' class="flag"' : '');
        const body = i===0 ? '<b>'+nl(c)+'</b>' : nl(c);
        return '<td'+cls+'>'+body+'</td>';
      }).join('')+'</tr>').join('')+'</tbody></table>'+(p.table.note?'<div class="src">'+nl(p.table.note)+'</div>':'')+'</div>';
  if(p.qa) h += '<div class="card"><h3>问答</h3>'+p.qa.map(x=>'<div class="qa"><b>Q：'+esc(x.q)+'</b><br>'+nl(x.a)+'</div>').join('')+'</div>';

  if(p.srcNote) h += '<div class="src" style="margin-top:12px">'+nl(p.srcNote)+'</div>';
  view.innerHTML = h;
}

<script>
/* ---------- search ---------- */
function idxText(f){
  const cu = D.content.features[f.id]||{};
  return [f.mod,f.name,f.desc,(cu.keys||[]).join(' ')].filter(Boolean).join(' ');
}
D.features.forEach(f=>{ f.__idx = idxText(f); });
function search(raw){
  const q = raw.trim().toLowerCase(); if(!q) return [];
  const out = [];
  const syn = [];
  for(const s of D.content.synonyms){
    for(const t of s.terms){ if(t.toLowerCase().indexOf(q)>=0 || q.indexOf(t.toLowerCase())>=0){ syn.push({to:s.to,term:t}); break; } }
  }
  for(const f of D.features){
    if(curV!=='ALL' && !vOn(f)) continue;
    let sc = 0, hit='';
    const nm=f.name.toLowerCase(), de=(f.desc||'').toLowerCase(), mo=f.mod.toLowerCase();
    if(nm===q) sc+=1000;
    if(nm.indexOf(q)>=0){ sc+=400 - nm.indexOf(q); hit=f.name; }
    if(mo.indexOf(q)>=0) sc+=150;
    if(de.indexOf(q)>=0){ sc+=60; hit=hit||f.desc.slice(0,60); }
    for(const s of syn){ if(s.to===f.id){ sc += 250 + Math.min(160, s.term.length*22); hit=hit||(s.term+' → '+f.name); } }
    if(sc>0) out.push({type:'f',id:f.id,title:f.name,mod:f.mod,sub:hit,score:sc,th:threshold(f)});
  }
  for(const p of D.pages){
    let sc=0;
    if(p.title.toLowerCase().indexOf(q)>=0) sc+=180;
    for(const s of syn){ if(s.to==='page:'+p.id) sc+=300; }
    if(sc) out.push({type:'p',id:p.id,title:p.title,mod:'',sub:'速查页',score:sc});
  }
  for(const m of D.modules){ if(m.toLowerCase().indexOf(q)>=0) out.push({type:'m',id:m,title:m+'（全部权益）',mod:'',sub:'模块',score:120}); }
  if(D.internal && D.mirror && D.mirror.faqs){
    D.mirror.faqs.forEach((x,i)=>{
      let sc=0;
      const qq=x.q.toLowerCase(), aa=x.a.toLowerCase();
      if(qq.indexOf(q)>=0){ sc+=320-qq.indexOf(q); }
      else if(aa.indexOf(q)>=0){ sc+=90; }
      if(sc) out.push({type:'q',id:i,title:x.q,mod:'FAQ·'+x.sec,sub:x.a.slice(0,70),score:sc});
    });
  }
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,14);
}
let sel=0, last=[];
const qEl=document.getElementById('q'), rEl=document.getElementById('results');
function paint(){
  if(!last.length){ rEl.className=''; rEl.innerHTML='<div class="res"><span class="mo">没有匹配项。换个说法试试：客户口语词（开多大的会 / 防截图 / 接口超限）或模块名。</span></div>'; rEl.classList.add('on'); return; }
  rEl.innerHTML = last.map((r,i)=>'<div class="res'+(i===sel?' sel':'')+'" data-i="'+i+'">'+
    '<span class="nm">'+esc(r.title)+'</span><span class="mo">'+esc(r.mod)+'</span><span class="hit">'+esc(r.sub||'')+'</span>'+
    (r.type==='f'&&curV!=='ALL' ? '<span class="th">'+esc(String(fById(r.id)[curV]||'—').split('\n')[0].slice(0,16))+'</span>' : (r.th?'<span class="th">'+r.th+' 起</span>':''))+'</div>').join('');
  rEl.classList.add('on');
}
function doSearch(){ last=search(qEl.value); sel=0; paint(); }
function openRes(i){
  const r=last[i]; if(!r) return;
  rEl.classList.remove('on'); qEl.blur();
  if(r.type==='f') go('#/f/'+r.id);
  else if(r.type==='q'){ pendingQ = r.id; go('#/page/faqfull'); }
  else if(r.type==='p') go('#/page/'+r.id);
  else go('#/page/mod-'+encodeURIComponent(r.id));
}
qEl.addEventListener('input',doSearch);
qEl.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,Math.max(0,last.length-1)); paint(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); paint(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(last.length) openRes(sel); }
  else if(e.key==='Escape'){ rEl.classList.remove('on'); qEl.blur(); }
});
rEl.addEventListener('click',e=>{ const d=e.target.closest('.res'); if(d&&d.dataset.i!==undefined) openRes(+d.dataset.i); });
document.addEventListener('mousedown',e=>{
  if(!e.target.closest || !e.target.closest('.searchwrap')) rEl.classList.remove('on');
});
qEl.addEventListener('blur',()=>{ setTimeout(()=>{ if(!document.activeElement || !document.activeElement.closest || !document.activeElement.closest('.searchwrap')) rEl.classList.remove('on'); },150); });
document.addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==qEl){ e.preventDefault(); focusSearch(); } });
function focusSearch(){ qEl.focus(); qEl.select(); }
</script>
<script>
/* ---------- 原文镜像（FAQ 全量 + 关键表格） ---------- */
function gate(){
  return '<div class="note">原文镜像来自钉钉内部知识库文档（含佣金、折扣、商机归属、对接人等内部口径）。默认隐藏：需要时点右上角「内部模式」。本页为文档原文自动解析，未做二次加工；合并单元格与空白列按原样保留，以原文档为准。</div>';
}
function tblHtml(rows, filter){
  const f = (filter||'').trim();
  const keep = rows.map((r,i)=>({r,i})).filter(x => !f || x.r.join(' ').indexOf(f)>=0);
  let hIdx = -1;
  for (let i=0;i<Math.min(rows.length,8);i++){
    const j = rows[i].join(' ');
    if (/功能类别|商品名称|服务维度|版本亮点|价格|类别/.test(j) && rows[i].filter(c=>c).length>=2){ hIdx=i; break; }
  }
  let h = '<div style="overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px"><table style="min-width:100%"><tbody>';
  keep.forEach(x=>{
    const r = x.r;
    const isH = x.i===hIdx;
    const pre = (hIdx<0 && x.i<4) || (hIdx>0 && x.i<hIdx);
    const cells = r.map((c)=>{
      const tag = isH?'th':'td';
      const st = (!isH&&pre)?' style="color:var(--tx2)"':'';
      return '<'+tag+st+'>'+nl(c)+'</'+tag+'>';
    }).join('');
    if(r.some(c=>c)) h += '<tr'+(isH?' style="background:#131d36"':'')+'>'+cells+'</tr>';
  });
  return h+'</tbody></table></div>';
}
function pageMirror(key, title, intro){
  if(!D.internal) { pageGeneric('mirrorlock'); return; }
  const groups = D.mirror.tables[key]||[];
  let h = '<h1>'+esc(title)+' <span class="badge-int">原文镜像 · 内部</span></h1><div class="sub">'+nl(intro)+'</div>'+gate();
  h += '<div style="margin-bottom:10px"><input id="mfilter" placeholder="在本表内筛选（关键词，如：会议室 / 云打印 / DT_GOODS）" style="width:100%;max-width:520px;padding:9px 12px;border-radius:9px;border:1px solid #2c3f6e;background:var(--panel);color:var(--tx);outline:none"></div>';
  h += '<div id="mbody">'+groups.map(g=>'<div class="card"><h3>'+esc(g.title)+'（'+g.rows.length+' 行）</h3>'+tblHtml(g.rows)+'</div>').join('')+'</div>';
  h += '<div class="src">数据由脚本从原 xlsx 直接解析生成，未人工转写；如与原文档不一致以原文档为准。</div>';
  view.innerHTML = h;
  const fi = document.getElementById('mfilter');
  fi.oninput = () => {
    document.getElementById('mbody').innerHTML = groups.map(g=>'<div class="card"><h3>'+esc(g.title)+'（'+g.rows.length+' 行）</h3>'+tblHtml(g.rows, fi.value)+'</div>').join('');
  };
}
let pendingQ = -1;
function faqList(f){
  const q = (f||'').trim();
  let h = '', cur = '';
  D.mirror.faqs.forEach((x,i)=>{
    if(q && (x.q+' '+x.a+' '+x.sec).indexOf(q)<0) return;
    if(x.sec!==cur){ cur=x.sec; h += '<h2 style="margin:18px 0 6px;font-size:15px;color:#9fc0ff">'+esc(cur)+'</h2>'; }
    h += '<div class="qa" id="qa'+i+'"><b>Q'+(i+1)+'：'+esc(x.q)+'</b><br>'+nl(x.a)+'</div>';
  });
  return h || '<div class="sub">没有命中，换个词。</div>';
}
function pageFaq(){
  if(!D.internal) { pageGeneric('mirrorlock'); return; }
  let h = '<h1>销售 FAQ 原文全量（'+D.mirror.faqs.length+' 问） <span class="badge-int">内部</span></h1>';
  h += '<div class="sub">来源：知识库《【钉钉商业版本】销售FAQ》docx 原文解析，含浏览器抓取时丢失的表格与后半部分章节（老品售卖、销售折扣、特殊客群、商机归属、学考、佣金等）。输入关键词只看命中的问答。</div>'+gate();
  h += '<div style="margin-bottom:10px"><input id="mfilter" placeholder="搜索问题关键词，如：降级 / 席位 / 续签 / 佣金 / 撞墙" style="width:100%;max-width:520px;padding:9px 12px;border-radius:9px;border:1px solid #2c3f6e;background:var(--panel);color:var(--tx);outline:none"></div>';
  h += '<div id="mbody">'+faqList('')+'</div>';
  view.innerHTML = h;
  const fi = document.getElementById('mfilter');
  fi.oninput = () => { document.getElementById('mbody').innerHTML = faqList(fi.value); };
  if(pendingQ>=0){ const el=document.getElementById('qa'+pendingQ); if(el){ el.scrollIntoView({block:'center'}); el.style.background='#24406f'; } pendingQ=-1; }
}
</script>
<script>
/* ---------- nav / router ---------- */
D.pages = D.pages || [];
const nav = document.getElementById('nav');
const NAVGROUPS = [
  { t:'面客速查', items:['pitch','jump','risk','standard','obj'] },
  { t:'产品 · AI 与 F 版', items:['ai','f'] },
  { t:'交易 / 政策 / 交付', items:['rules','timeline','d4'] },
  { t:'报价', items:['addons','price'] },
  { t:'原文镜像（内部文档）', items:['faqfull','feishu','codes','sowview','highlight'], internal:true },
  { t:'校核与纪律', items:['conflict','verify','sources'] }
];
function navTitle(p){ return p.title.replace(/^[①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳]+\s*/,''); }
function buildNav(){
  let h = '';
  for(const g of NAVGROUPS){
    const ents = g.items.map(id=>D.pages.find(p=>p.id===id)).filter(Boolean);
    h += '<h4>'+g.t+'</h4>';
    if(g.internal && !D.internal){ h += '<div class="nv dim">已隐藏 '+ents.length+' 项内部内容 · 点右上角「内部模式」开启</div>'; continue; }
    h += ents.map(p=>'<div class="nv" data-h="#/page/'+p.id+'" onclick="go(\'#/page/'+p.id+'\')">'+esc(navTitle(p))+(p.internal?' <span class="badge-int">内</span>':'')+'</div>').join('');
  }
  h += '<h4>功能模块（'+D.modules.length+' 个 · '+vLabel()+'）</h4>';
  h += D.modules.map(m=>{
    const all=modOf(m), c = curV==='ALL'?all.length:all.filter(vOn).length;
    return '<div class="nv" data-h="#/page/mod-'+encodeURIComponent(m)+'" onclick="go(\'#/page/mod-'+encodeURIComponent(m)+'\')">'+m+'<span class="ct">'+c+(curV!=='ALL'?'/'+all.length:'')+'</span></div>';
  }).join('');
  nav.innerHTML = h;
}
function go(h){ location.hash = h; }
function route(){
  const h = location.hash||'#/';
  document.querySelectorAll('.nv').forEach(n=>n.classList.toggle('on', n.dataset.h===h));
  if(h.startsWith('#/f/')) return renderFeature(h.slice(4));
  if(h.startsWith('#/page/')){
    const id = decodeURIComponent(h.slice(7));
    if(id.startsWith('mod-')) return renderModule(id.slice(4));
    if(id==='jump') return pageJump();
    if(id==='risk') return pageRisk();
    if(id==='ai') return pageAI();
    if(id==='f') return pageF();
    if(id==='price') return pagePrice();
    if(id==='verify') return pageVerify();
    if(id==='sources') return pageSources();
    if(id==='faqfull') return pageFaq();
    if(id==='feishu') return pageMirror('feishu','vs 飞书 竞品对比（原表镜像）','来源：《【钉钉商业版本】竞品对比（vs飞书）.xlsx》。表内「和飞书的对比」列是官方给的结论口径（持平/领先等），对客引用竞品参数时只说这页里有的内容。');
    if(id==='codes') return pageMirror('codetree','商品 Code 树与老品下架清单','来源：《新商品体系Code树.xlsx》《【钉钉】老商品Code梳理-手册版.xlsx》。C 类=原底座及部分用量单品（2027.9.30 前可续签可增购、不可新签）；D 类=被底座合并的单品（按退市过渡处理）。客户问「我以前买的 XX 还能不能续」，先在这两张表里找 code。');
    if(id==='sowview') return pageMirror('sow','SOW 权益速览与服务边界','来源：《【钉钉商业版本】SOW.xlsx》中的权益速览、服务 SOW、D4 交付定价与交付范围四个 Sheet。合同条款以最新 SOW 为准。');
    if(id==='highlight') return pageMirror('highlight','核心价值 highlight（版本定位与亮点）','来源：《【钉钉商业版本】核心价值highlight.xlsx》。原文注明「所有差异请见《钉钉新底座sow》」。');
    return pageGeneric(id);
  }
  return pageHome();
}
window.addEventListener('hashchange',route);
document.getElementById('homeBtn').onclick=()=>go('#/');
document.getElementById('internal').onchange=e=>{ D.internal=e.target.checked; buildNav(); route(); if(qEl.value) doSearch(); if(window.__updateFootbar) window.__updateFootbar(); };
function buildVBtns(){
  const all = [['全部','ALL']].concat(DKEYS.map(k=>[k,k]));
  document.getElementById('vbtns').innerHTML = all.map(([t,k])=>'<div class="vbtn'+(k===curV?' on':'')+'" onclick="setV(\''+k+'\')" title="'+(k==='ALL'?'不按版本筛选':(DLABEL[k]+' 视角：搜索与模块清单只看该档'))+'">'+t+'</div>').join('');
}
function setV(k){
  curV=k; window.__v=k; buildVBtns(); buildNav(); route();
  if(qEl.value) doSearch();
}
document.getElementById('dtVer').textContent = D.content.meta.build;
D.internal=false;
buildNav(); buildVBtns(); route();

/* ========== v2.3 模式选择与手机 UI 逻辑 ========== */
(function(){
  const modal = document.getElementById('modeModal');
  const remember = document.getElementById('modeRemember');
  const KEY = 'bst_mode_v23';
  const dtVerM = document.getElementById('dtVerM');
  // 提前取元素引用，避免被 applyMode 在初始化阶段调用时触发 TDZ
  const navEl = document.getElementById('nav');
  const footbar = document.getElementById('footbar');
  if(dtVerM) dtVerM.textContent = D.content.meta.build;

  // 检测窄屏，预选推荐项
  const narrow = window.innerWidth < 820 || /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
  if(narrow){
    const m = modal.querySelector('[data-mode="mobile"]');
    if(m) m.classList.add('recommend');
  } else {
    const p = modal.querySelector('[data-mode="pc"]');
    if(p) p.classList.add('recommend');
  }

  function applyMode(mode){
    document.body.classList.remove('mode-pc','mode-mobile');
    document.body.classList.add('mode-'+mode);
    const sw = document.getElementById('modeSwTxt');
    const swBtn = document.getElementById('modeSwBtn');
    if(sw) sw.textContent = mode==='mobile' ? '切电脑' : '切手机';
    if(swBtn) swBtn.firstChild && (swBtn.innerHTML = (mode==='mobile'?'💻':'🖥️')+'<span id="modeSwTxt">'+(mode==='mobile'?'切电脑':'切手机')+'</span>');
    // 关闭抽屉
    closeDrawer();
    // 更新底部栏激活态
    updateFootbar();
    // 手机端强制刷新一次视图，防止表格宽度未重排
    if(typeof route === 'function') route();
  }
  window.__setMode = function(mode, doSave){
    applyMode(mode);
    if(doSave){
      try{ localStorage.setItem(KEY, mode); }catch(e){}
    }
  };
  window.__getMode = function(){
    return document.body.classList.contains('mode-mobile') ? 'mobile' : 'pc';
  };

  // 读取已保存的模式
  let saved = null;
  try{ saved = localStorage.getItem(KEY); }catch(e){}
  if(saved === 'pc' || saved === 'mobile'){
    modal.classList.add('hide');
    applyMode(saved);
  } else {
    // 显示弹窗
    modal.classList.remove('hide');
    modal.querySelectorAll('.mode-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const m = btn.dataset.mode;
        modal.classList.add('hide');
        applyMode(m);
        if(remember.checked){
          try{ localStorage.setItem(KEY, m); }catch(e){}
        }
      });
    });
  }

  // 右上角切换按钮
  document.getElementById('modeSwBtn').addEventListener('click', ()=>{
    const next = window.__getMode()==='mobile' ? 'pc' : 'mobile';
    window.__setMode(next, true);
  });

  /* ---------- 手机模式：抽屉导航 ---------- */
  function openDrawer(){
    if(window.__getMode()!=='mobile') return;
    if(navEl.classList.contains('drawer-open')) return;
    // 注入抽屉头
    if(!navEl.querySelector('.drawer-head')){
      const head = document.createElement('div');
      head.className = 'drawer-head';
      head.innerHTML = '<b>📚 导航</b><button class="drawer-close" type="button" aria-label="关闭">×</button>';
      navEl.insertBefore(head, navEl.firstChild);
      head.querySelector('.drawer-close').addEventListener('click', closeDrawer);
    }
    navEl.classList.add('drawer-open');
    // 遮罩
    if(!document.getElementById('drawerMask')){
      const mask = document.createElement('div');
      mask.id = 'drawerMask';
      mask.className = 'drawer-mask';
      mask.addEventListener('click', closeDrawer);
      document.body.appendChild(mask);
    }
    document.body.style.overflow = 'hidden';
  }
  function closeDrawer(){
    navEl.classList.remove('drawer-open');
    const mask = document.getElementById('drawerMask');
    if(mask) mask.remove();
    document.body.style.overflow = '';
  }
  window.__closeDrawer = closeDrawer;
  window.__openDrawer = openDrawer;
  document.getElementById('mobMenu').addEventListener('click', openDrawer);

  // 点击导航项后自动关闭抽屉
  navEl.addEventListener('click', e=>{
    if(e.target.closest('.nv') && window.__getMode()==='mobile'){
      setTimeout(closeDrawer, 60);
    }
  });

  /* ---------- 手机模式：底部快捷栏 ---------- */
  function updateFootbar(){
    if(!footbar) return;
    const h = location.hash || '#/';
    footbar.querySelectorAll('.fb').forEach(b=>{
      const act = b.dataset.act;
      let on = false;
      if(act==='home') on = (h==='#/' || h==='');
      else if(act==='modules') on = h.indexOf('#/page/mod-')===0 || h.indexOf('#/f/')===0;
      b.classList.toggle('on', on);
    });
  }
  if(footbar){
    footbar.addEventListener('click', e=>{
      const b = e.target.closest('.fb'); if(!b) return;
      const act = b.dataset.act;
      if(act==='home') go('#/');
      else if(act==='search'){ document.getElementById('q').focus(); document.getElementById('q').select(); }
      else if(act==='modules') openDrawer();
      updateFootbar();
    });
  }
  window.addEventListener('hashchange', updateFootbar);
  window.__updateFootbar = updateFootbar;

  /* ---------- 手机模式：路由变化后自动回顶 ---------- */
  window.addEventListener('hashchange', ()=>{
    if(window.__getMode && window.__getMode()==='mobile'){
      const v = document.getElementById('view');
      if(v) v.scrollTop = 0;
    }
  });

  /* ---------- 手机模式：回到顶部按钮 ---------- */
  const mobTop = document.getElementById('mobTop');
  const viewEl = document.getElementById('view');
  if(mobTop && viewEl){
    viewEl.addEventListener('scroll', ()=>{
      if(window.__getMode()!=='mobile') return;
      mobTop.style.opacity = viewEl.scrollTop > 300 ? '1' : '0';
      mobTop.style.pointerEvents = viewEl.scrollTop > 300 ? 'auto' : 'none';
    });
    mobTop.style.opacity = '0';
    mobTop.style.pointerEvents = 'none';
    mobTop.style.transition = 'opacity .2s';
    mobTop.addEventListener('click', ()=>{ viewEl.scrollTo({top:0,behavior:'smooth'}); });
  }

  /* ---------- 手机模式：搜索结果点击后收起键盘 ---------- */
  const qEl2 = document.getElementById('q');
  if(qEl2){
    qEl2.addEventListener('focus', ()=>{
      if(window.__getMode()==='mobile') window.scrollTo(0,0);
    });
  }

  /* ---------- 手机模式：视口高度自适应（iOS Safari 地址栏） ---------- */
  function setVH(){
    const vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', vh+'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ setVH(); if(typeof route==='function') route(); }, 200); });

  /* ---------- 自动给表格包横向滚动容器 .tw（仅呈现结构，不改内容） ---------- */
  function wrapTablesOnce(root){
    (root||document).querySelectorAll('table').forEach(t=>{
      if(t.closest('.tw')) return;
      const w = document.createElement('div');
      w.className = 'tw';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
  }
  window.__wrapTables = wrapTablesOnce;
  wrapTablesOnce(document);
  let rafPending = false;
  const mo = new MutationObserver(()=>{
    if(rafPending) return;
    rafPending = true;
    requestAnimationFrame(()=>{ rafPending = false; wrapTablesOnce(document.getElementById('view')); });
  });
  mo.observe(document.getElementById('view'), { childList:true, subtree:true });
})();
</script>
</body>
</html>
